/* 7.1 · Criatura clicável como alvo (teclado, toque, mouse) */

button.m71-target.selected,button.m71-target.selected:hover{border:2px solid #e0435a;background:linear-gradient(110deg,#32131d,#1a0d13);box-shadow:0 0 0 2px #911d3540,0 0 18px #be273744}

.settings-page button.settings-secondary-button,.settings-guest-head button.settings-secondary-button{background:#071019!important;border:1px solid #526d9a!important;color:#dde7f0!important}
.settings-page button.settings-primary-button{background:#14291e!important;border:1px solid #57b680!important;color:#c8f3d8!important;box-shadow:0 0 14px #53c4841a!important}

.settings-toggle{display:flex!important;align-items:center;gap:14px!important;justify-content:space-between;padding:18px!important;border:1px solid #2d456ba8;background:#050811ae!important;cursor:pointer;position:relative;margin-bottom:20px;color:#e3e8ee!important}
.settings-toggle-copy b{display:block;font:400 20px/1.2 Georgia,serif}
.settings-toggle-copy small{display:block;font:12px/1.6 Georgia,serif;margin-top:7px;color:#a3adbd}
.settings-toggle input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px;right:28px;top:22px}
.settings-switch{display:block;flex:none;width:52px;height:27px;border:1px solid #46536d;background:#0f121c;box-shadow:inset 0 0 9px #000}
.settings-switch:before{content:'';display:block;width:19px;height:19px;background:#697189;margin:3px;transition:transform .18s,background .18s}
.settings-toggle input:checked+.settings-switch{border-color:#5abb86;background:#10251a}
.settings-toggle input:checked+.settings-switch:before{transform:translateX(23px);background:#65c78f;box-shadow:0 0 9px #65c78f80}
.settings-toggle input:focus-visible+.settings-switch{outline:2px solid #cbf6de;outline-offset:4px}
.settings-audio-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:17px}
.settings-audio-actions>button{flex:0 1 auto}
.settings-audio-signal{display:flex;gap:4px;height:30px;align-items:center;flex:none}
.settings-audio-signal i{width:3px;height:6px;background:#4ca976;animation:settingsMeter .85s ease-in-out infinite alternate;box-shadow:0 0 9px #43a87055}
.settings-audio-signal i:nth-child(2n){height:19px;animation-delay:-.3s}
.settings-audio-signal i:nth-child(3n){height:11px;animation-delay:-.6s}
@keyframes settingsMeter{to{height:3px;opacity:.45}}
.settings-end{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#67778e;font-size:9px}
.settings-guest-shell{position:relative;z-index:5;min-height:100vh;padding:clamp(20px,4vw,65px);max-width:1600px;margin:auto}
.settings-guest-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:25px;color:#879dc2;font:12px ui-monospace,Consolas,monospace}
.settings-login-access{display:flex;justify-content:center;margin-top:24px}
.settings-login-access button{font:12px ui-monospace,Consolas,monospace!important;letter-spacing:.09em!important}
.settings-page :is(button,a,input):focus-visible{outline:2px solid #c4e7d5;outline-offset:3px}
@media(max-width:1000px){.settings-layout{grid-template-columns:1fr}.settings-chapters{position:static;display:flex;align-items:center;flex-wrap:wrap}.settings-chapters>span{margin:0 12px 0 0}.settings-chapters a{padding:10px 13px}.settings-chapters-foot{display:none}}

@media print{.settings-page{color:#111}.settings-chapters,.settings-guest-head{display:none}}

<script>
/* SLASHER P2P: manual WebRTC signaling, host authoritative game session.
   No Supabase / centralized signaling. Public STUN only, TURN not included.
   The host must keep this browser tab open. */
(function(){
 'use strict';
 const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
 const MAX_SIGNAL=35000,CHUNK=12000,MAX_MESSAGE=1200000;
 const pending=new Map(),live=new Map(),pendingRPC=new Map(),pieces=new Map();
 const uid=()=>crypto.randomUUID?.()||Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
 let client=null,requestSerial=0;
 const callbacks={};
 const signal=obj=>btoa(Array.from(new TextEncoder().encode(JSON.stringify(obj)),x=>String.fromCharCode(x)).join(''));
 function parse(code,type){
  if(!code||code.length>MAX_SIGNAL)throw Error('Código de conexão vazio ou grande demais');
  let value;
  try{const str=atob(code.replace(/\s/g,''));value=JSON.parse(new TextDecoder().decode(Uint8Array.from(str,c=>c.charCodeAt(0))))}catch{throw Error('Código de conexão inválido ou incompleto')}
  if(value.v!==1||value.type!==type||typeof value.sdp!=='string'||!value.sdp.startsWith('v=0')||value.sdp.length>25000||typeof value.id!=='string')throw Error('Código de conexão incompatível');
  return value;
 }
 function gather(pc){return new Promise((resolve,reject)=>{
  if(pc.iceGatheringState==='complete')return resolve();
  const timer=setTimeout(()=>{pc.removeEventListener('icegatheringstatechange',test);reject(Error('Não foi possível reunir as rotas de conexão. Tente gerar outro convite.'))},18000);
  function test(){if(pc.iceGatheringState==='complete'){clearTimeout(timer);pc.removeEventListener('icegatheringstatechange',test);resolve()}}
  pc.addEventListener('icegatheringstatechange',test);
 })}
 function make(){if(!window.RTCPeerConnection)throw Error('Seu navegador não oferece WebRTC. Use uma versão atual do Firefox ou Chrome.');return new RTCPeerConnection(ICE)}
 function transmit(dc,message){if(!dc||dc.readyState!=='open')throw Error('O outro participante está desconectado');
  const text=JSON.stringify(message);if(text.length>MAX_MESSAGE)throw Error('Mensagem grande demais para P2P');
  const id=uid(),count=Math.ceil(text.length/CHUNK);
  for(let i=0;i<count;i++)dc.send(JSON.stringify({packet:id,index:i,total:count,payload:text.slice(i*CHUNK,(i+1)*CHUNK)}));
 }
 function listen(dc,who){
  dc.onmessage=event=>{
   try{
    const part=JSON.parse(event.data);
    if(!part||typeof part.packet!=='string'||part.packet.length>80||!Number.isInteger(part.index)||!Number.isInteger(part.total)||part.total<1||part.total>130||part.index<0||part.index>=part.total||typeof part.payload!=='string'||part.payload.length>CHUNK)throw Error('Pacote P2P inválido');
    const key=who.key+':'+part.packet;
    let data=pieces.get(key);
    if(!data){data={time:Date.now(),array:Array(part.total),count:0};pieces.set(key,data)}
    if(data.array.length!==part.total)throw Error('Pacote inconsistênte');
    if(data.array[part.index]===undefined){data.array[part.index]=part.payload;data.count++}
    if(data.count===part.total){pieces.delete(key);const msg=JSON.parse(data.array.join(''));received(who,msg)}
    if(pieces.size>80)for(const [k,p] of pieces)if(Date.now()-p.time>30000)pieces.delete(k);
   }catch(e){console.warn('SLASHER P2P pacote ignorado:',e)}
  };
  dc.onclose=()=>{if(who.role==='host')live.delete(who.key);for(const [id,req] of pendingRPC)if(req.who===who){clearTimeout(req.timer);req.reject(Error('A conexão com o mestre caiu'));pendingRPC.delete(id)}callbacks.disconnected?.(who)};
 }
 function received(who,msg){
  if(!msg||typeof msg.type!=='string')return;
  if(who.role==='host'){
   if(msg.type==='hello'&&!who.id){who.id='peer-'+uid();who.nick=String(msg.nick||'Sobrevivente').trim().slice(0,32);if(who.nick.length<2)who.nick='Sobrevivente';live.set(who.key,who);transmit(who.dc,{type:'welcome',id:who.id,nick:who.nick});callbacks.hello?.(who);return}
   if(msg.type==='request'&&who.id&&typeof msg.reqid==='string'&&msg.reqid.length<100){Promise.resolve().then(()=>callbacks.request?.(who,msg.method,msg.args)).then(result=>transmit(who.dc,{type:'reply',reqid:msg.reqid,ok:true,result})).catch(e=>{try{transmit(who.dc,{type:'reply',reqid:msg.reqid,ok:false,error:String(e?.message||e)})}catch{}});return}
  }else{
   if(msg.type==='welcome'){who.id=msg.id;callbacks.welcome?.(msg);return}
   if(msg.type==='snapshot'){callbacks.snapshot?.(msg.payload);return}
   if(msg.type==='reply'){const task=pendingRPC.get(msg.reqid);if(!task)return;clearTimeout(task.timer);pendingRPC.delete(msg.reqid);msg.ok?task.resolve(msg.result):task.reject(Error(msg.error||'Ação negada pelo mestre'));return}
  }
 }
 async function hostOffer(){
  const pc=make(),id=uid(),key=id;let dc;
  try{
   dc=pc.createDataChannel('slasher-sync',{ordered:true});const who={key,pc,dc,role:'host',id:null,nick:null};
   listen(dc,who);
   const offer=await pc.createOffer();await pc.setLocalDescription(offer);await gather(pc);
   pending.set(id,who);
   return signal({v:1,type:'offer',id,sdp:pc.localDescription.sdp});
  }catch(e){pc.close();throw e}
 }
 async function joinOffer(code,nick){
  const offer=parse(code,'offer');const pc=make(),key='client-'+offer.id;
  try{
   const who={key,pc,role:'client',id:null,nick:String(nick||'').trim().slice(0,32),dc:null};
   client=who;
   pc.ondatachannel=e=>{who.dc=e.channel;listen(who.dc,who);who.dc.onopen=()=>transmit(who.dc,{type:'hello',nick:who.nick})};
   await pc.setRemoteDescription({type:'offer',sdp:offer.sdp});const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await gather(pc);
   return signal({v:1,type:'answer',id:offer.id,sdp:pc.localDescription.sdp});
  }catch(e){pc.close();client=null;throw e}
 }
 async function acceptAnswer(code){const answer=parse(code,'answer');const who=pending.get(answer.id);if(!who)throw Error('Esse convite não está mais ativo. Gere um novo.');pending.delete(answer.id);await who.pc.setRemoteDescription({type:'answer',sdp:answer.sdp});return true}
 function snapshot(payload){for(const who of live.values()){try{transmit(who.dc,{type:'snapshot',payload})}catch(e){console.warn('P2P: envio falhou',e)}}}
 function call(method,args){if(!client||client.dc?.readyState!=='open'||!client.id)return Promise.reject(Error('Aguardando conexão com o mestre'));
  const reqid='r'+(++requestSerial)+'-'+Date.now();return new Promise((resolve,reject)=>{
   const timer=setTimeout(()=>{pendingRPC.delete(reqid);reject(Error('O mestre não respondeu à solicitação'))},20000);
   pendingRPC.set(reqid,{who:client,resolve,reject,timer});try{transmit(client.dc,{type:'request',reqid,method,args})}catch(e){clearTimeout(timer);pendingRPC.delete(reqid);reject(e)}
  });
 }
 function close(){for(const who of [...pending.values(),...live.values(),client].filter(Boolean)){try{who.dc?.close();who.pc.close()}catch{}}
  pending.clear();live.clear();client=null;for(const [id,p] of pendingRPC){clearTimeout(p.timer);p.reject(Error('Mesa encerrada'));pendingRPC.delete(id)}
 }
 window.SLASHER_P2P={hostOffer,joinOffer,acceptAnswer,snapshot,call,close,on:(type,cb)=>callbacks[type]=cb,peers:()=>Array.from(live.values()).map(w=>({id:w.id,nick:w.nick,state:w.dc?.readyState})),isClientReady:()=>!!client?.id};
})();

</script>
<script>
/* SLASHER CRT / display effects, persisted locally. Events survive page rerenders. */
(function(){
 'use strict';
 const KEY='slasher-crt-intensity-v1';
 const FX_KEYS={bloom:'slasher-crt-bloom-v1',chroma:'slasher-crt-chroma-v1'};
 const FX_DEFAULT={bloom:35,chroma:30};
 const ORDER=['soft','classic','strong','off'];
 const fxState={...FX_DEFAULT};
 function safePct(v,defaultValue){if(v==null||v==='')return defaultValue;const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n/5)*5)):defaultValue}
 function saved(k){try{return localStorage.getItem(k)}catch{return null}}
 function put(k,v){try{localStorage.setItem(k,String(v))}catch{}}
 function setFx(effect,value,store=true){
  if(!(effect in FX_KEYS))return;
  const pct=safePct(value,FX_DEFAULT[effect]);fxState[effect]=pct;
  const root=document.documentElement;
  if(effect==='bloom'){
   root.style.setProperty('--crt-bloom-core',(pct/100*.54).toFixed(3));
   root.style.setProperty('--crt-bloom-halo',(pct/100*.38).toFixed(3));
   root.style.setProperty('--crt-bloom-border',(pct/100*.24).toFixed(3));
  }else{
   const px=(pct/100*1.8).toFixed(2)+'px';const neg=(-pct/100*1.8).toFixed(2)+'px';
   root.style.setProperty('--crt-chroma-left',neg);
   root.style.setProperty('--crt-chroma-right',px);
   root.style.setProperty('--crt-chroma-alpha',(pct===0?0:.32).toFixed(3));
  }
  const input=document.getElementById('slasher-fx-'+effect);if(input)input.value=String(pct);
  const output=document.getElementById('slasher-fx-'+effect+'-value');if(output)output.textContent=pct+'%';
  if(store)put(FX_KEYS[effect],pct);
 }
 function apply(mode,store=false){
  const current=ORDER.includes(mode)?mode:'classic';
  document.documentElement.dataset.crt=current;
  const overlay=document.getElementById('slasher-crt');if(overlay)overlay.dataset.mode=current;
  document.querySelectorAll('[data-crt-mode]').forEach(b=>{
    const chosen=b.dataset.crtMode===current;
    b.setAttribute('aria-pressed',String(chosen));b.classList.toggle('is-active',chosen);
    const marker=b.querySelector('.settings-mode-mark');if(marker)marker.textContent=chosen?'◆':'◇';
  });
  const label=document.getElementById('settings-crt-status');if(label){label.textContent=current==='off'?'DESLIGADO':'ATIVO';label.dataset.disabled=String(current==='off')}
  if(store)put(KEY,current);
  return current;
 }
 apply(saved(KEY)||'classic');
 for(const effect of Object.keys(FX_KEYS))setFx(effect,safePct(saved(FX_KEYS[effect]),FX_DEFAULT[effect]),false);
 document.addEventListener('click',e=>{
   const mode=e.target.closest('[data-crt-mode]');if(mode){apply(mode.dataset.crtMode,true);return}
   if(e.target.closest('#slasher-fx-reset'))for(const key of Object.keys(FX_KEYS))setFx(key,FX_DEFAULT[key]);
 });
 document.addEventListener('input',e=>{for(const key of Object.keys(FX_KEYS))if(e.target.id==='slasher-fx-'+key)setFx(key,e.target.value)});
 window.SLASHER_CRT={set:mode=>{if(ORDER.includes(mode))apply(mode,true)},get:()=>document.documentElement.dataset.crt,effects:()=>({...fxState}),setFx,sync:()=>apply(document.documentElement.dataset.crt)};
})();

</script>
<script>
/* SLASHER / UI AUDIO: original procedural retro/lo-fi sounds.
   No samples, no autoplay, no external files. All notes start on user gesture. */
(function(){
 'use strict';
 const PREF='slasher-ui-sound-v1';
 const DEFAULT={enabled:true,volume:30};
 let setting={...DEFAULT},ctx=null,mix=null,noiseBuffer=null,hoverAt=0,lastPlayed=0,hoverNode=null;
 const clamp=n=>Math.max(0,Math.min(100,Math.round(Number(n)||0)));
 try{
  const p=JSON.parse(localStorage.getItem(PREF)||'null');
  if(p&&typeof p==='object'){
   if(typeof p.enabled==='boolean')setting.enabled=p.enabled;
   if(Number.isFinite(Number(p.volume)))setting.volume=clamp(p.volume);
  }
 }catch{}
 function persist(){try{localStorage.setItem(PREF,JSON.stringify(setting))}catch{}}
 function applyUi(){
  const enabled=document.getElementById('slasher-audio-enabled'),level=document.getElementById('slasher-audio-volume'),out=document.getElementById('slasher-audio-volume-value');
  if(enabled)enabled.checked=setting.enabled;
  if(level){level.value=String(setting.volume);level.disabled=!setting.enabled;}
  if(out)out.textContent=setting.enabled?setting.volume+'%':'OFF';
  const label=document.getElementById('settings-audio-status');if(label){label.textContent=setting.enabled?'ATIVO':'MUDO';label.dataset.disabled=String(!setting.enabled)}
  const mute=document.getElementById('slasher-audio-mute');if(mute)mute.textContent=setting.enabled?'♫ Silenciar':'♫ Ativar som';
  const test=document.getElementById('slasher-audio-test');if(test)test.disabled=!setting.enabled||setting.volume===0;
  if(mix&&ctx){mix.gain.setTargetAtTime(setting.enabled?(setting.volume/100)**1.35*.38:0,ctx.currentTime,.012);}
 }
 function ensureAudio(){
  if(!setting.enabled||setting.volume<=0||document.hidden)return false;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  try{
   if(!ctx){ctx=new AC();mix=ctx.createGain();mix.gain.value=0;mix.connect(ctx.destination);applyUi();}
   if(ctx.state==='suspended')ctx.resume().catch(()=>{});
   if(ctx.state==='closed')return false;
   return true;
  }catch{return false;}
 }
 function env(g,t,gain,attack,decay){
  const min=.00001;
  g.gain.setValueAtTime(min,t);
  g.gain.linearRampToValueAtTime(Math.max(min,gain),t+attack);
  g.gain.exponentialRampToValueAtTime(min,t+attack+decay);
 }
 function tone(start,duration,f1,f2,level=.19,wave='triangle',cutoff=1100){
  if(!ctx||!mix)return;
  const osc=ctx.createOscillator(),lp=ctx.createBiquadFilter(),gain=ctx.createGain();
  lp.type='lowpass';lp.frequency.value=cutoff;lp.Q.value=.7;
  osc.type=wave;osc.frequency.setValueAtTime(f1,start);osc.frequency.exponentialRampToValueAtTime(Math.max(20,f2),start+duration);
  env(gain,start,level,Math.min(.007,duration*.2),Math.max(.014,duration-.007));
  osc.connect(lp);lp.connect(gain);gain.connect(mix);osc.start(start);osc.stop(start+duration+.03);
 }
 function noise(start,duration,level=.07,center=550){
  if(!ctx||!mix)return;
  if(!noiseBuffer){
   const len=Math.round(ctx.sampleRate*.35);noiseBuffer=ctx.createBuffer(1,len,ctx.sampleRate);
   const data=noiseBuffer.getChannelData(0);
   for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*.72;
  }
  const src=ctx.createBufferSource(),band=ctx.createBiquadFilter(),low=ctx.createBiquadFilter(),gain=ctx.createGain();
  band.type='bandpass';band.frequency.value=center;band.Q.value=.6;
  low.type='lowpass';low.frequency.value=1600;
  src.buffer=noiseBuffer;env(gain,start,level,.004,Math.max(.012,duration-.004));
  src.connect(band);band.connect(low);low.connect(gain);gain.connect(mix);src.start(start);src.stop(start+duration+.02);
 }
 function play(name,opts={}){
  if(!ensureAudio())return false;
  const t=ctx.currentTime+.005;
  // Upper limit on rapid-fire notes prevents audio piling up on fast repeated actions.
  if(!opts.force&&name==='hover'&&t-lastPlayed<.09)return false;
  lastPlayed=t;
  switch(name){
   case 'hover': tone(t,.037,425,352,.075,'sine',850);break;
   case 'navigate':tone(t,.085,474,320,.16,'triangle',930);noise(t,.033,.022,950);break;
   case 'confirm':tone(t,.095,492,585,.18,'triangle',1200);tone(t+.064,.14,720,630,.11,'sine',1180);break;
   case 'back':tone(t,.135,345,178,.19,'triangle',730);noise(t,.044,.018,480);break;
   case 'item':tone(t,.072,505,410,.14,'triangle',980);noise(t+.035,.085,.055,610);tone(t+.055,.095,660,460,.095,'sine',900);break;
   case 'purchase':tone(t,.09,396,510,.13,'triangle',1050);tone(t+.079,.13,598,740,.125,'triangle',1220);noise(t,.057,.03,1100);break;
   case 'dice':for(let i=0;i<4;i++){const dt=i*.063;noise(t+dt,.065,.055-i*.005,360+i*110);tone(t+dt,.045,180+i*34,115+i*33,.10-i*.01,'triangle',650);}tone(t+.275,.17,250,160,.15,'sine',600);break;
   case 'danger':tone(t,.12,205,174,.16,'sawtooth',470);tone(t+.084,.17,189,115,.12,'triangle',420);break;

function getFocus(s){const saved=focusKey||getLocal(focusStorage(s),null);const own=s.characters.filter(c=>roleGM(s)||c.owner_id===s.user?.id);const all=[...own.map(c=>({key:'c:'+c.id,type:'character',data:c})),...(roleGM(s)?currentData(s).monsters.map(m=>({key:'m:'+m.id,type:'monster',data:m})):[])];return all.find(x=>x.key===saved)||all[0]||null}
function avatar(person,type='character',size='normal'){
 const title=esc(person?.name||'?');const portrait=person?.portrait||'';
 return `<div class="m71-portrait ${size} ${type==='monster'?'monster':''}">${portrait.startsWith('data:image/')?`<img src="${esc(portrait)}" alt="Retrato de ${title}">`:`<span>${type==='monster'?'☠':title[0]||'?'}</span>`}</div>`;
}
function meter(label,now,max,kind='',active=false,pre=null){const value=Number(now||0),p=pct(value,max);const from=pre==null?p:pct(pre,max);return `<div class="m71-meter-wrap ${active?'hit':''}"><div class="m71-between"><span>${esc(label)}</span><strong class="m71-numeric" ${active&&pre!=null?`data-m71-from="${Number(pre)}" data-m71-to="${value}" data-m71-max="${max}"`:''}>${value} / ${max}</strong></div><div class="m71-meter ${kind}" style="--m71-from:${from}%;--m71-to:${p}%"><div class="m71-meter-ghost"></div><div class="m71-meter-fill"></div></div></div>`}
function characterStatus(s,focus){if(!focus)return `<div class="m71-empty-hero"><h2>Nenhuma ficha disponível.</h2><p>Crie um sobrevivente na aba “Sobreviventes” ou peça ao mestre para atribuir uma ficha.</p><button class="btn red" data-action="go" data-value="characters">Abrir sobreviventes</button></div>`;
 const c=focus.data,monster=focus.type==='monster';const max=Number(c.hp_max||16),statuses=(s.effects||[]).filter(e=>e.character_id===c.id&&e.kind==='condition');const item=(!monster?currentData(s).inventory.find(i=>i.id===activeWeapon(s,c.id)):null);const latest=currentData(s).events[0];const justHit=latest?.id===flashId&&(monster?latest.target_monster_id===c.id:latest.target_character_id===c.id)&&latest.hit;const hpFrom=justHit?latest.hp_before:null;
 return `<section class="m71-hero"><div class="m71-hero-copy"><div class="eyebrow">DUNMOORE / ARQUIVO DA SESSÃO</div><div class="m71-hero-label">${monster?'ENTIDADE REGISTRADA':'SOBREVIVENTE EM CAMPO'}</div><h2>${esc(c.name)}</h2><p>${monster?esc(c.description||'A cidade não deveria conhecer esta presença.'):esc(c.occupation||'Habitante de Dunmoore')} · ${monster?'CRIATURA':esc(c.class_key?.toUpperCase()||'SOBREVIVENTE')}</p><div class="m71-status-stack">${meter('VIDA',c.hp,max,'hp',justHit,hpFrom)}${!monster?meter('STAMINA',c.stamina,c.stamina_max,'stamina')+meter('ESTRESSE',c.stress,100,'stress'):meter('DANO',c.damage_sides,c.damage_sides,'stamina')}</div><div class="m71-conditions">${monster?`<span class="m71-pill">DEFESA ${c.defense}</span><span class="m71-pill">ATAQUE 1d${c.damage_sides}</span>`:statuses.map(e=>`<span class="m71-pill dangerous">✚ ${esc(e.title)}</span>`).join('')||'<span class="m71-pill">SEM CONDIÇÕES</span>'}</div></div><div class="m71-hero-character">${avatar(c,monster?'monster':'character','hero')}<div class="m71-portrait-caption">${monster?'DOSSIÊ DA CRIATURA':'REGISTRO Nº '+String(c.id).slice(0,6).toUpperCase()}</div></div><div class="m71-evidence"><div class="eyebrow">EM DESTAQUE</div><div class="m71-evidence-symbol">${monster?'☠':item?'⚔':'⌾'}</div><h3>${monster?'A ameaça observa':item?esc(item.title):'Nenhuma arma equipada'}</h3><p>${monster?'O mestre controla os ataques desta entidade.':item?`Dano automático ${diceLabel(item.damage_sides)}. Escolhida no inventário.`:'Abra o inventário e selecione uma arma.'}</p><div class="m71-evidence-bottom">${monster?esc(c.name):'ARQUIVO PESSOAL · DUNMOORE'}</div></div></section>`;
}
function inventoryWidget(s,focus){const c=focus?.type==='character'?focus.data:null;const inv=currentData(s).inventory.filter(i=>i.character_id===c?.id);const legacy=(s.effects||[]).filter(e=>e.character_id===c?.id&&e.kind==='item');if(!c)return '<div class="m71-info">Selecione um sobrevivente para consultar os pertences.</div>';

function diceWidget(s,focus){const c=focus?.type==='character'?focus.data:null;return `<p class="m71-help">Teste livre com D20. Para atacar e causar dano real, use a janela <b>Combate atual</b>.</p><form data-mesa-form="test" class="m71-form"><label>Sobrevivente<input name="char_name" value="${esc(c?.name||'Sem personagem')}" disabled></label><div class="m71-two"><label>Atributo<select name="attr">${[['none','Sem atributo'],['CIE','Ciências'],['RAL','Raciocínio'],['COC','Oculto'],['EDF','Educação física'],['REF','Reflexos'],['TEC','Tecnologia'],['CRI','Criatividade'],['SOC','Social']].map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Circunstância<select name="circumstance">${[-4,-3,-2,-1,0,1,2,3,4].map(n=>`<option value="${n}" ${n===0?'selected':''}>${n>0?'+':''}${n}</option>`).join('')}</select></label></div><label>O que você está tentando fazer?<input name="description" maxlength="120" placeholder="Ex.: Escapar pelo corredor"></label><button class="btn red" type="submit" ${!s.campaignId?'disabled':''}>⬡ Rolar D20</button></form>`}

function eventsWidget(s){const d=currentData(s);return `<div class="m71-events">${d.events.map((e,i)=>{const victim=s.characters.find(c=>c.id===e.target_character_id)||d.monsters.find(m=>m.id===e.target_monster_id);const atk=s.characters.find(c=>c.id===e.actor_character_id)||d.monsters.find(m=>m.id===e.actor_monster_id);const isNew=e.id===flashId;return `<article class="m71-event ${e.hit?'hit':'miss'} ${isNew?'impact':''}"><div class="m71-event-top"><span class="eyebrow">${e.hit?'ACERTO':'ERRO'} · ${new Date(e.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><span class="m71-pill ${e.hit?'dangerous':''}">${e.hit?`-${e.damage} HP`:'SEM DANO'}</span></div><h4>${esc(e.actor_name)} <span>atacou</span> ${esc(e.target_name)}</h4><div class="m71-event-flow"><div class="m71-event-actor">${avatar(atk||{name:e.actor_name},e.actor_monster_id?'monster':'character')}<b>${esc(e.actor_name)}</b></div><span class="m71-event-arrow">➜</span><div class="m71-event-actor">${avatar(victim||{name:e.target_name},e.target_monster_id?'monster':'character')}<b>${esc(e.target_name)}</b></div></div>${meter('HP do alvo',e.hp_after,e.hp_max,'hp',isNew,e.hp_before)}<div class="m71-event-footer"><span>D20 <b>${e.die_roll}</b> · total <b>${e.total}</b> vs defesa <b>${e.defense}</b></span><span>Arma: ${esc(e.weapon_name)}</span></div>${isNew&&e.hit?`<span class="m71-floating">-${e.damage} HP</span>`:''}</article>`}).join('')||'<div class="m71-info">Nenhum confronto registrado. Os próximos ataques aparecerão aqui para todos os participantes.</div>'}</div>`;}

async function compressPortrait(file){if(!file||!file.size)throw Error('Selecione uma imagem');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Formato não permitido');if(file.size>8*1024*1024)throw Error('Imagem acima de 8 MB');return new Promise((resolve,reject)=>{const src=URL.createObjectURL(file),img=new Image();img.onerror=()=>{URL.revokeObjectURL(src);reject(Error('Não foi possível ler a imagem'))};img.onload=()=>{URL.revokeObjectURL(src);try{const k=Math.min(1,300/img.width,380/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*k));canvas.height=Math.max(1,Math.round(img.height*k));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.7);if(data.length>149000)data=canvas.toDataURL('image/jpeg',.43);if(data.length>149000)throw Error('Imagem muito grande mesmo após otimizar');resolve(data)}catch(e){reject(e)}};img.src=src})}

class DemoAPI{
 constructor(){this.me={id:'demo-gm',email:'mestre@dunmoore.demo'};this.data=null}
 seed(){const id='dunmoore-1999',now=dateNow();const mk=(key,name,owner,age,occupation)=>{const attrs=attrObj(key),max=12+2*attrs.EDF;return {id:uuid(),campaign_id:id,owner_id:owner,name,class_key:key,age,occupation,attrs,hp:max, hp_max:max,stamina:max,stamina_max:max,stress:0,notes:'',portrait:'',updated_at:now}};
 const chars=[mk('reb','Eleanor Hayes','demo-player',18,'estudante e fotógrafa'),mk('atl','Daniel Mercer','demo-player2',19,'atleta do colégio'),mk('pro','Sr. Wallace',null,54,'professor de história'),mk('par','Margaret Voss',null,37,'arquivista municipal')];
 chars[0].hp=13;chars[0].stress=34;chars[1].hp=8;chars[1].stress=73;
 return {campaigns:[{id,name:'Dunmoore: Ecos da Montanha',invite_code:'DEMO-777',suspicion:2,danger:1,created_at:now}],members:[{campaign_id:id,user_id:'demo-gm',role:'gm',nickname:'Mestre'},{campaign_id:id,user_id:'demo-player',role:'player',nickname:'Eleanor'},{campaign_id:id,user_id:'demo-player2',role:'player',nickname:'Daniel'}],characters:chars,effects:[{id:uuid(),campaign_id:id,character_id:chars[0].id,kind:'item',title:'Lanterna de bolso',details:'Uma pilha ainda funciona.'},{id:uuid(),campaign_id:id,character_id:chars[0].id,kind:'skill',title:'Saída lateral',details:cls('reb')[3]},{id:uuid(),campaign_id:id,character_id:chars[1].id,kind:'condition',title:'Hemorragia',details:'Perde 2 HP por rodada até receber primeiros socorros.'}],rolls:[],audit:[],notes:{[id]:'Uma presença antiga reclama nomes. A escola encobre os registros de 2008. Não revele aos jogadores antes da hora.'}}}
 save(){try{localStorage.setItem(NOCACHE,JSON.stringify(this.data))}catch{ /* armazenamento restrito: sessão em memória */ }}
 async init(){try{this.data=JSON.parse(localStorage.getItem(NOCACHE))||this.seed()}catch{this.data=this.seed()}this.save();return this.me}
 async logout(){return true}
 async listCampaigns(){return this.data.members.filter(m=>m.user_id===this.me.id).map(m=>({...m,campaign:this.data.campaigns.find(c=>c.id===m.campaign_id)}))}
 async createCampaign(n,nick){const id=uuid(),c={id,name:n,invite_code:uuid().replace(/-/g,'').slice(0,12).toUpperCase(),suspicion:0,danger:0,created_at:dateNow()};this.data.campaigns.push(c);this.data.members.push({campaign_id:id,user_id:this.me.id,role:'gm',nickname:nick});this.data.notes[id]='';this.save();return id}
 async joinCampaign(code,nick){const c=this.data.campaigns.find(c=>c.invite_code===code.trim().toUpperCase());if(!c)throw Error('Código não encontrado nesta demonstração. Para jogar com amigos, configure o modo online.');this.data.members.push({campaign_id:c.id,user_id:this.me.id,role:'player',nickname:nick});this.save();return c.id}
 async loadCampaign(id){return {campaign:this.data.campaigns.find(c=>c.id===id),members:this.data.members.filter(m=>m.campaign_id===id),characters:this.data.characters.filter(c=>c.campaign_id===id),effects:this.data.effects.filter(e=>e.campaign_id===id),rolls:this.data.rolls.filter(r=>r.campaign_id===id).slice(-80).reverse(),audit:this.data.audit.filter(a=>a.campaign_id===id).slice(-35).reverse(),gmNote:this.data.notes[id]||''}}
 async createCharacter(p){const attrs=attrObj(p.class_key);const max=12+2*attrs.EDF,id=uuid();this.data.characters.push({id,campaign_id:p.campaign_id,owner_id:p.npc?null:this.me.id,name:p.name,class_key:p.class_key,age:p.age,occupation:p.occupation,attrs,hp:max,hp_max:max,stamina:max,stamina_max:max,stress:0,notes:'',portrait:'',updated_at:dateNow()});this.save();return id}
 audit(message,ch){this.data.audit.push({id:uuid(),campaign_id:state.campaignId,actor_id:this.me.id,character_id:ch,message,created_at:dateNow()})}
 async changeStat(id,key,d){const c=this.data.characters.find(c=>c.id===id);if(!c)throw Error('Ficha não encontrada');c[key]=Math.min(key==='stress'?100:c[key+'_max'],Math.max(0,c[key]+d));this.audit(`Alterou ${key} em ${d}`,id);this.save()}
 async grantEffect(id,kind,title,details){this.data.effects.push({id:uuid(),campaign_id:state.campaignId,character_id:id,kind,title,details,created_at:dateNow()});this.audit(`Concedeu ${kind}: ${title}`,id);this.save()}
 async removeEffect(id){const e=this.data.effects.find(e=>e.id===id);if(!e)return;this.data.effects=this.data.effects.filter(e=>e.id!==id);this.audit(`Removeu ${e.kind}: ${e.title}`,e.character_id);this.save()}
 async setClock(k,v){this.data.campaigns.find(c=>c.id===state.campaignId)[k]=v;this.save()}
 async saveNote(t){this.data.notes[state.campaignId]=t;this.save()}
 async updateCharacter(ch){const c=this.data.characters.find(c=>c.id===ch.id);Object.assign(c,{name:ch.name,notes:ch.notes,portrait:ch.portrait,updated_at:dateNow()});this.save()}
 async assignCharacter(chId,owner){this.data.characters.find(c=>c.id===chId).owner_id=owner;this.audit('Atribuição de ficha alterada',chId);this.save()}
 async roll(p){const natural=p.clientDice?.natural??window.SLASHER_DICE.face(20);const sides=+p.damage_sides||0;const r={id:uuid(),campaign_id:p.campaign_id,actor_id:this.me.id,character_id:p.character_id,kind:p.kind,description:p.description,natural,modifier:p.modifier,total:natural+p.modifier,damage:p.kind==='test'||!sides?0:(p.clientDice?.damage??window.SLASHER_DICE.face(sides)),created_at:dateNow()};this.data.rolls.push(r);this.save();return r}
}
// ---- Adaptador Supabase: RLS, Auth, RPC e Postgres Changes ----
class SupaAPI{
 async init(){const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');this.sb=mod.createClient(config.supabaseUrl,config.supabaseAnonKey);const {data,error}=await this.sb.auth.getUser();if(error&&!String(error.message).includes('Auth session missing'))console.warn(error);return data?.user||null}
 async auth(kind,email,password){const fn=kind==='register'?'signUp':'signInWithPassword';const {data,error}=await this.sb.auth[fn]({email,password});if(error)throw error;return data}
 async anonymousAuth(nickname){const name=String(nickname||'').trim();if(!/^[\p{L}\p{N} ._-]{2,32}$/u.test(name))throw Error('Nome de usuário inválido (2 a 32 caracteres).');const {data,error}=await this.sb.auth.signInAnonymously({options:{data:{display_name:name}}});if(error)throw error;if(!data?.session||!data.user)throw Error('Ative Anonymous Sign-Ins nas configurações do Supabase.');return data}

 async logout(){const {error}=await this.sb.auth.signOut();if(error)throw error}
 async query(q){const {data,error}=await q;if(error)throw error;return data}
 async rpc(name,args){return this.query(this.sb.rpc('slasher_'+name,args))}
 async listCampaigns(){const a=await this.query(this.sb.from('campaign_members').select('campaign_id,role,nickname,campaigns(*)').eq('user_id',state.user.id).order('joined_at',{ascending:false}));return a.map(m=>({...m,campaign:m.campaigns}))}
 async createCampaign(n,nick){return this.rpc('create_campaign',{p_name:n,p_nickname:nick})}
 async joinCampaign(code,nick){return this.rpc('join_campaign',{p_code:code,p_nickname:nick})}
 async loadCampaign(id){const [campaign,members,characters,effects,rolls,audit,notes]=await Promise.all([
  this.query(this.sb.from('campaigns').select('*').eq('id',id).single()),
  this.query(this.sb.from('campaign_members').select('*').eq('campaign_id',id).order('joined_at')),
  this.query(this.sb.from('characters').select('*').eq('campaign_id',id).order('created_at')),
  this.query(this.sb.from('character_effects').select('*').eq('campaign_id',id).order('created_at')),
  this.query(this.sb.from('rolls').select('*').eq('campaign_id',id).order('created_at',{ascending:false}).limit(80)),
  this.query(this.sb.from('audit_log').select('*').eq('campaign_id',id).order('created_at',{ascending:false}).limit(35)),
  this.query(this.sb.from('gm_notes').select('content').eq('campaign_id',id).maybeSingle())]);
  return {campaign,members,characters,effects,rolls,audit,gmNote:notes?.content||''};}
 async createCharacter(p){return this.rpc('create_character',{p_campaign_id:p.campaign_id,p_name:p.name,p_class:p.class_key,p_age:p.age,p_occupation:p.occupation,p_npc:p.npc})}
 async changeStat(id,key,d){return this.rpc('change_stat',{p_character_id:id,p_stat:key,p_delta:d})}
 async grantEffect(id,kind,title,details){return this.rpc('grant_effect',{p_character_id:id,p_kind:kind,p_title:title,p_details:details})}
 async removeEffect(id){return this.rpc('remove_effect',{p_effect_id:id})}
 async setClock(key,v){return this.rpc('set_clock',{p_campaign_id:state.campaignId,p_clock:key,p_value:v})}
 async saveNote(t){return this.rpc('save_gm_note',{p_campaign_id:state.campaignId,p_text:t})}
 async updateCharacter(ch){return this.rpc('update_character',{p_character_id:ch.id,p_name:ch.name,p_notes:ch.notes,p_portrait:ch.portrait})}
 async assignCharacter(chId,owner){return this.rpc('assign_character',{p_character_id:chId,p_owner:owner||null})}
 async roll(p){
  const standard={p_campaign_id:p.campaign_id,p_character_id:p.character_id||null,p_kind:p.kind,p_description:p.description,p_modifier:p.modifier,p_damage_sides:p.damage_sides||0};
  if(p.clientDice){
    try{return await this.rpc('roll_local',{...standard,p_natural:p.clientDice.natural,p_damage_face:p.clientDice.damage})}
    catch(e){const msg=String(e.message||'');if(/could not find the function|PGRST202|does not exist/i.test(msg))throw Error('Banco incompleto. Execute install.sql em um projeto Supabase novo.');throw e}
  }
  return this.rpc('roll',standard)
 }
 subscribe(id,callback){this.unsubscribe();const tables=['campaigns','campaign_members','characters','character_effects','rolls','audit_log','slasher71_monsters','slasher71_inventory','slasher71_shops','slasher71_shop_stock','slasher71_encounters','slasher71_combat_events'];const channel=this.sb.channel('slasher7-'+id);
 for(const table of tables)channel.on('postgres_changes',{event:'*',schema:'public',table,filter:table==='campaigns'?`id=eq.${id}`:`campaign_id=eq.${id}`},()=>callback());
 channel.subscribe(status=>{state.connection=status==='SUBSCRIBED'?'live':status==='CHANNEL_ERROR'?'reconectando':'conectando';updateConnectionStatus()});state.channel=channel;}
 unsubscribe(){if(state.channel){this.sb.removeChannel(state.channel);state.channel=null}}
}

function p2pPublicSnapshot(){
 const camp=state.campaignId,dat=api.data;
 const raw=state.mesa71||{};
 const visible=!!raw.encounter?.active;
 const mesa={monsters:visible?(raw.monsters||[]):[],inventory:raw.inventory||[],shop:raw.shop||null,stock:raw.stock||[],encounter:raw.encounter||null,events:raw.events||[],ready:true,error:''};
 return {campaign:dat.campaigns.find(c=>c.id===camp),members:dat.members.filter(m=>m.campaign_id===camp),characters:dat.characters.filter(c=>c.campaign_id===camp),effects:dat.effects.filter(e=>e.campaign_id===camp),rolls:dat.rolls.filter(r=>r.campaign_id===camp).slice(-80).reverse(),audit:dat.audit.filter(e=>e.campaign_id===camp).slice(-35).reverse(),mesa71:mesa};
}
function broadcastP2P(){if(state.mode==='p2p-host'&&state.campaignId&&state.campaign)P2P.snapshot(p2pPublicSnapshot())}
function safeInput(s,max=120){return String(s||'').trim().slice(0,max)}
function downloadP2PBackup(){
 if(state.mode!=='p2p-host')throw Error('Só o mestre pode salvar o arquivo da campanha');
 const table={};
 try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith('slasher71_local_'))table[key]=JSON.parse(localStorage.getItem(key))}}catch{}
 if(state.campaignId&&state.mesa71)table['slasher71_local_'+state.campaignId]=state.mesa71;
 const saved={type:'slasher-p2p-backup',format:1,exportedAt:dateNow(),data:api.data,mesa:table};
 const blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='SLASHER_P2P_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Backup do SLASHER exportado. Guarde esse arquivo em segurança.');
}
async function restoreP2PBackup(file){
 if(state.mode!=='p2p-host')throw Error('Somente o mestre importa backups');
 if(P2P.peers().length)throw Error('Desconecte os jogadores antes de restaurar um backup');
 if(!file||file.size>6*1024*1024)throw Error('O backup precisa ter menos de 6 MB');
 const backup=JSON.parse(await file.text());const db=backup?.data;
 if(backup.type!=='slasher-p2p-backup'||backup.format!==1||!db||!Array.isArray(db.campaigns)||!Array.isArray(db.members)||!Array.isArray(db.characters)||!Array.isArray(db.effects)||!Array.isArray(db.rolls)||!Array.isArray(db.audit)||typeof db.notes!=='object'||!db.notes||typeof backup.mesa!=='object'||!backup.mesa)throw Error('Backup incompatível ou corrompido');
 if(db.campaigns.length>100||db.characters.length>500||Object.keys(backup.mesa).length>100)throw Error('Backup acima do limite permitido');
 if(!confirm('Substituir os arquivos locais do mestre pelos dados deste backup? Esta ação não pode ser desfeita.'))return;
 api.data=db;api.save();
 for(const [key,value] of Object.entries(backup.mesa))if(key.startsWith('slasher71_local_')&&key.length<130)try{localStorage.setItem(key,JSON.stringify(value))}catch{}
 state.mesa71=null;await loadLobby();toast('Backup restaurado. Abra a campanha para voltar ao jogo.');
}

async function handleGuestRequest(who,method,args){
 if(state.mode!=='p2p-host'||!state.campaignId||!state.campaign)throw Error('O mestre não abriu a campanha');
 if(!api.data.members.some(m=>m.campaign_id===state.campaignId&&m.user_id===who.id))throw Error('Participante não reconhecido');
 const [a,b,c,d]=Array.isArray(args)?args:[];
 const owned=id=>{const ch=api.data.characters.find(x=>x.id===id&&x.campaign_id===state.campaignId);if(!ch||ch.owner_id!==who.id)throw Error('Esta ficha não pertence a você');return ch};
 let result;
 if(method==='createCharacter'){
  const p=a||{};if(!CLASSES.some(x=>x[0]===p.class_key)||!safeInput(p.name,90)||p.name.length>90)throw Error('Ficha inválida');
  result=await api.createCharacter({campaign_id:state.campaignId,name:safeInput(p.name,90),class_key:p.class_key,age:Math.max(10,Math.min(100,Number(p.age)||18)),occupation:safeInput(p.occupation,120),npc:false});
  api.data.characters.find(ch=>ch.id===result).owner_id=who.id;api.save();
 }else if(method==='updateCharacter'){
  owned(a?.id);result=await api.updateCharacter({id:a.id,name:safeInput(a.name,90),notes:String(a.notes||'').slice(0,5000),portrait:String(a.portrait||'').slice(0,170000)})
 }else if(method==='roll'){
  const p=a||{};if(p.character_id)owned(p.character_id);
  if(p.kind!=='test'&&p.kind!=='attack')throw Error('Rolagem não autorizada');
  const modifier=Number(p.modifier),sides=Number(p.damage_sides||0);
  if(!Number.isInteger(modifier)||modifier< -12||modifier>12||![0,4,6,8,10,12].includes(sides))throw Error('Dado inválido');
  result=await api.roll({campaign_id:state.campaignId,character_id:p.character_id||null,kind:p.kind,description:safeInput(p.description,160),modifier,damage_sides:sides,clientDice:{natural:window.SLASHER_DICE.face(20),damage:sides?window.SLASHER_DICE.face(sides):0}});result.actor_id=who.id;api.save();
 }else if(method==='mesa'){
  const op=a,params=b||{};if(!['buy','attack'].includes(op))throw Error('Operação exclusiva do mestre');
  if(op==='buy'){owned(params.p_character)}
  if(op==='attack'){
   owned(params.p_actor_character);
   if(!state.mesa71?.encounter?.active)throw Error('Não há combate ativo');
   if(params.p_actor_monster||params.p_target_character||!state.mesa71.monsters.some(m=>m.id===params.p_target_monster&&m.hp>0))throw Error('Alvo inválido');
   const item=state.mesa71.inventory.find(x=>x.id===params.p_inventory);
   if(params.p_inventory&&(!item||item.character_id!==params.p_actor_character||item.kind!=='weapon'||item.quantity<1))throw Error('Arma inválida');
   const die=item?.damage_sides||4;
   params.p_client_natural=window.SLASHER_DICE.face(20);params.p_client_damage_face=window.SLASHER_DICE.face(die);
  }
  result=window.SLASHER71.remote(state,op,params,who.id);
 }else throw Error('Ação não autorizada ao jogador P2P');
 await refreshCampaign(false);broadcastP2P();return result;
}
function guestMethods(){
 api.save=()=>{};
 api.listCampaigns=async()=>api.data.members.filter(m=>m.user_id===api.me.id).map(m=>({...m,campaign:api.data.campaigns.find(c=>c.id===m.campaign_id)}));
 api.createCampaign=()=>Promise.reject(Error('Só o mestre pode criar campanhas'));
 api.joinCampaign=()=>Promise.reject(Error('Use o convite WebRTC para entrar'));
 for(const fn of ['createCharacter','updateCharacter','roll'])api[fn]=(...args)=>P2P.call(fn,args);
 for(const fn of ['changeStat','grantEffect','removeEffect','setClock','saveNote','assignCharacter'])api[fn]=()=>Promise.reject(Error('Ação exclusiva do mestre'));
 api.remoteMesa=(op,args)=>P2P.call('mesa',[op,args]);
}

function effectGroup(ch,kind,label){let entries=state.effects.filter(x=>x.character_id===ch.id&&x.kind===kind);return `<div class="panel"><div class="panel-title"><h3>${label}</h3><span class="tag">${entries.length}</span></div><div class="item-list">${entries.map(e=>`<div class="item"><div><strong><span class="accent">${roleIcon(kind)}</span> ${esc(e.title)}</strong><small>${esc(e.details||'Nenhuma descrição')}</small></div>${isGM()?`<button class="btn small negative" data-action="remove-effect" data-id="${e.id}" title="Retirar recurso">Remover</button>`:`<span class="chip">${kind==='item'?'EQUIP.':kind==='skill'?'TALENTO':'ESTADO'}</span>`}</div>`).join('')||`<div class="hint">${kind==='item'?'Nenhum item registrado.':kind==='skill'?'Nenhuma habilidade concedida.':'Nenhuma condição ativa.'}</div>`}</div>${isGM()?`<button class="btn small flat" style="margin-top:12px" data-action="modal" data-value="grant" data-kind="${kind}" data-id="${ch.id}">+ Adicionar ${kind==='item'?'item':kind==='skill'?'habilidade':'condição'}</button>`:''}</div>`}
function renderSheet(){const ch=selected();if(!ch)return `${titleBlock('FICHA / ARQUIVO DO SOBREVIVENTE','Sobrevivente','Escolha um personagem para começar.')}<div class="empty">Nenhum personagem criado.<div style="margin-top:15px"><button class="btn red" data-action="modal" data-value="create-character">Criar ficha</button></div></div>`;
const powers=cls(ch.class_key);const can=canEdit(ch);const editable=can?`<button class="btn small flat" data-action="modal" data-value="edit-character" data-id="${ch.id}">Editar retrato e anotações</button>`:'';
return `${titleBlock('REGISTRO / DUNMOORE','Ficha do sobrevivente','Pessoas desaparecem; suas fichas permanecem.',`<select aria-label="Escolher personagem" id="sheet-picker" style="width:auto;min-width:180px">${state.characters.map(x=>`<option value="${x.id}" ${x.id===ch.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}<div class="sheet-layout"><div class="stack"><div class="panel profile-panel">${avatar(ch,'large')}<div class="name">${esc(ch.name)}</div><p class="eyebrow" style="margin:8px 0">${esc(powers[1])} • ${ch.age} ANOS</p><p class="muted tiny">${esc(ch.occupation||'Ocupação não registrada')}</p><p class="tiny" style="margin:10px 0">${ch.owner_id?`Ficha de ${esc(actorName(ch.owner_id))}`:'NPC / Controle do mestre'}</p>${editable}<div class="row" style="justify-content:center;margin-top:10px">${isGM()?`<button class="btn small flat" data-action="modal" data-value="assign" data-id="${ch.id}">Atribuir jogador</button>`:''}</div></div><div class="panel"><div class="eyebrow">PODER DO ARQUÉTIPO</div><h3 style="margin:8px 0">${esc(powers[2])}</h3><p class="hint">${esc(powers[3])}</p></div><div class="panel"><div class="panel-title"><h3>Diário pessoal</h3></div><p class="hint" style="white-space:pre-wrap">${esc(ch.notes||'Nenhum registro. As coisas esquecidas costumam voltar.')}</p></div></div><div class="stack"><div class="panel"><div class="panel-title"><h3>Condição física</h3><span class="chip ${ch.hp<=0?'red':'good'}">${ch.hp<=0?'INCAPACITADO':ch.hp<=Math.floor(ch.hp_max/2)?'FERIDO':'VIVO'}</span></div><div class="grid3">${statBox('HP',ch.hp,ch.hp_max,'hp')}${statBox('STAMINA',ch.stamina,ch.stamina_max,'sta')}${statBox('ESTRESSE',ch.stress,100,'stress')}</div></div><div class="panel"><div class="panel-title"><h3>Atributos</h3><span class="tag">10 PONTOS</span></div><div class="attribute-grid">${ATTR.map(([k,name])=>`<div class="attr" title="${esc(name)}"><small>${k}</small><div class="number">${Number(ch.attrs[k]||0)}</div></div>`).join('')}</div><p class="hint" style="margin-top:13px">Teste: 1d20 + atributo + circunstância • DTs: 8 / 12 / 16 / 20.</p><button class="btn red" style="margin-top:12px" data-action="go" data-value="dice">⬡ Rolar um teste</button></div><div class="grid2">${effectGroup(ch,'item','Inventário')}${effectGroup(ch,'skill','Habilidades')}</div>${effectGroup(ch,'condition','Ferimentos e condições')}</div></div>`}
function rollDescription(kind,attribute,characterName){const suffix=characterName?' · '+characterName:'';if(kind==='monster')return 'Ataque de criatura';if(kind==='attack')return 'Ataque de sobrevivente'+suffix;const a=ATTR.find(([key])=>key===attribute);return (a?'Teste de '+a[1]+' ('+a[0]+')':'Teste geral (sem atributo)')+suffix}
function renderRollList(limit=30){const list=state.rolls.slice(0,limit);return `<div class="journal">${list.map(r=>`<div class="journal-event"><div class="between"><b>${r.kind==='monster'?'☠ ':r.kind==='attack'?'⚔ ':'⬡ '}${esc(r.description||'Teste de habilidade')}</b><small>${fmt(r.created_at)}</small></div><p>${esc(actorName(r.actor_id))} · D20 <b class="accent">${r.natural}</b> ${r.modifier<0?'−':'+'} ${Math.abs(r.modifier)} = <b style="color:white">${r.total}</b>${r.damage?' · dano '+r.damage:''}</p></div>`).join('')||'<div class="empty"><b>Silêncio total.</b>Nenhuma rolagem registrada ainda.</div>'}</div>`}
function renderDice(){const choices=state.characters.filter(ch=>own(ch)||isGM());const ch=selected();const def=choices.find(c=>c.id===ch?.id)||choices[0];return `${titleBlock('ARQUIVO DE COMBATE / D20','Rolagens de dados','Resultado animado, registrado e compartilhado com a mesa.')}<div class="grid2"><div class="panel"><div class="panel-title"><h3>Executar rolagem</h3><span class="chip red">1D20</span></div><form id="dice-form"><label class="field">Quem está rolando<select name="character_id"><option value="">Sem personagem</option>${choices.map(c=>`<option value="${c.id}" ${c.id===def?.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field">Tipo de rolagem<select name="kind" id="dice-kind"><option value="test">Teste de atributo</option><option value="attack">Ataque de sobrevivente</option>${isGM()?'<option value="monster">Ataque de criatura</option>':''}</select></label><label class="field">Descrição<input name="description" maxlength="160" placeholder="Ex.: fugir do Escavado, atacar com canivete"></label><div class="field-row"><label class="field">Atributo<select name="attribute" id="dice-attr"><option value="none">Sem atributo</option>${ATTR.map(([k,n])=>`<option value="${k}">${k} · ${esc(n)}</option>`).join('')}</select></label><label class="field">Circunstância<select name="circumstance">${[-4,-3,-2,-1,0,1,2,3,4].map(n=>`<option value="${n}" ${n===0?'selected':''}>${n>0?'+':''}${n}</option>`).join('')}</select></label></div><label class="field">Dado de dano (para ataques)<select name="damage_sides"><option value="0">Sem dado</option><option value="4">1d4</option><option value="6" selected>1d6</option><option value="8">1d8</option><option value="10">1d10</option><option value="12">1d12</option></select></label><p class="hint" style="margin:10px 0 16px">O D20 é sorteado imediatamente no navegador. O registro online é sincronizado após a rolagem; o dano do combate é confirmado pelo servidor.</p><button type="submit" class="btn red wide">⬡ ROLAR D20</button></form></div><div class="panel"><div class="panel-title"><h3>Registro da mesa</h3><span class="tag">TEMPO REAL</span></div>${renderRollList(25)}</div></div>`}
function clockRender(key,title,max,desc){const val=Number(state.campaign?.[key]||0);return `<div class="panel"><div class="between"><div><div class="eyebrow">${title}</div><h3>${val} / ${max}</h3></div><span class="tag">MESTRE</span></div><p class="hint">${desc}</p><div class="clock">${Array.from({length:max},(_,i)=>`<button class="${val>i?'filled':''}" data-action="set-clock" data-key="${key}" data-value="${i+1}" title="Definir ${i+1}">${val>i?'✕':'·'}</button>`).join('')}</div><button class="btn small flat" data-action="set-clock" data-key="${key}" data-value="0">Zerar relógio</button></div>`}
function renderGm(){if(!isGM())return '<div class="empty">Apenas o mestre pode entrar neste arquivo.</div>';const ch=selected();return `${titleBlock('MESTRE / ARQUIVO CONFIDENCIAL','O narrador não esquece.','Controle os recursos, eventos e estados de todos os sobreviventes.',`<button class="btn red" data-action="random-npc">⚄ Criar NPC aleatório</button><button class="btn flat" data-action="modal" data-value="create-character">+ Criar ficha</button>`)}<div class="grid2" style="margin-bottom:16px">${clockRender('suspicion','SUSPEITA DA CIDADE',6,'O quanto Dunmoore suspeita da investigação.')}${clockRender('danger','PERIGO DO LOCAL',4,'A ameaça cresce quando a investigação faz barulho.')}</div><div class="gm-grid"><div class="panel"><div class="panel-title"><h3>Ficha sob controle</h3><span class="chip red">PAINEL DO MESTRE</span></div><label class="field">Sobrevivente<select id="gm-picker">${state.characters.map(c=>`<option value="${c.id}" ${c.id===ch?.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>${ch?`<div class="row" style="margin-bottom:13px">${avatar(ch)}<div><b>${esc(ch.name)}</b><p class="tiny muted">${esc(cls(ch.class_key)[1])}</p></div></div>${[['hp','HP',ch.hp,ch.hp_max],['stamina','STA',ch.stamina,ch.stamina_max],['stress','EST',ch.stress,100]].map(([k,label,n,max])=>`<div class="between" style="margin:11px 0"><div><div class="eyebrow">${label}</div><b class="mono">${n} / ${max}</b></div><div class="counter-control"><button class="btn small flat" data-action="stat" data-id="${ch.id}" data-stat="${k}" data-delta="-5">−5</button><button class="btn small flat" data-action="stat" data-id="${ch.id}" data-stat="${k}" data-delta="-1">−1</button><button class="btn small soft" data-action="stat" data-id="${ch.id}" data-stat="${k}" data-delta="1">+1</button><button class="btn small soft" data-action="stat" data-id="${ch.id}" data-stat="${k}" data-delta="5">+5</button></div></div>`).join('')}<hr class="sep"><div class="row"><button class="btn red" data-action="modal" data-value="grant" data-id="${ch.id}" data-kind="item">+ Item</button><button class="btn flat" data-action="modal" data-value="grant" data-id="${ch.id}" data-kind="skill">+ Habilidade</button><button class="btn flat" data-action="modal" data-value="grant" data-id="${ch.id}" data-kind="condition">+ Condição</button></div>`:'<p class="hint">Crie uma ficha para acessar os controles.</p>'}</div><div class="stack"><div class="panel"><div class="panel-title"><h3>Notas secretas</h3><span class="chip red">INVISÍVEL AOS JOGADORES</span></div><label class="field">Plano, pistas e informações ocultas<textarea id="gm-note" rows="6" maxlength="20000" placeholder="Somente o mestre vê este texto">${esc(state.gmNote)}</textarea></label><button class="btn red" data-action="save-gm-note">Salvar segredo</button></div><div class="panel"><div class="panel-title"><h3>Registro administrativo</h3></div><div class="journal">${state.audit.slice(0,12).map(a=>`<div class="journal-event"><b>${esc(a.message)}</b><p>${esc(actorName(a.actor_id))} · ${fmt(a.created_at)}</p></div>`).join('')||'<p class="hint">Nenhuma ação do mestre registrada.</p>'}</div></div></div></div><div class="panel" style="margin-top:16px"><div class="panel-title"><h3>Código de convite</h3></div><div class="invite"><div class="eyebrow">CONVITE DE CAMPANHA</div><div class="mono">${esc(state.campaign.invite_code)}</div><div class="row" style="margin-top:12px"><button class="btn small flat" data-action="copy-invite">Copiar convite</button><span class="hint">Envie aos jogadores que possuem uma conta.</span></div></div></div>`}
function renderRules(){const rules=[['TESTES','1d20 + atributo (0–4) + circunstância (até ±4). DT 8 fácil; 12 normal; 16 difícil; 20 extremo. Falha por 1 a 3 pode obter sucesso com custo.'],['VIDA E MORTE','HP máximo = 12 + (2×EDF). Um golpe de 6+ dano ou crítico gera ferimento grave. A 0 HP o personagem fica incapacitado.'],['HEMORRAGIA','Hemorragia grave: perde 2 HP por rodada até receber socorro. Primeiros socorros exigem recursos e oportunidade, não são magia de cura.'],['STAMINA','STA máxima = 12 + (2×EDF). Esquiva custa 3 STA. Descansos seguros recuperam STA, mas não apagam ferimentos graves.'],['ESTRESSE','Estresse de 0 a 100. O medo impõe escolhas e consequências, não perda automática da agência do jogador.'],['ATAQUE DO PREDADOR','A criatura anuncia intenção antes de executar a ameaça. Investigar, bloquear acesso e fugir costuma ser melhor que enfrentar.'],['INVESTIGAÇÃO','Pistas essenciais não exigem rolagem. Dados decidem tempo, discrição e custos. Não trave a história por uma falha.'],['RECUPERAÇÃO','Feridas persistem e precisam de cuidados e dias. A sobrevivência deve ter consequências além da cena.']];return `${titleBlock('REGRAS / SLASHER','A lei da sobrevivência','A edição X reúne a mesa conectada, efeitos CRT e áudio lo-fi. O núcleo de regras permanece compatível com o manual da edição VI.',`<a class="btn red" href="manual-6.html" target="_blank" rel="noopener">Abrir manual completo ↗</a>`)}<div class="rules-grid">${rules.map(([a,b])=>`<div class="rule-section"><div class="eyebrow">PROTOCOLO ${a}</div><h3>${a}</h3><p>${b}</p></div>`).join('')}</div>`}
function renderModal(){if(!state.modal)return '';const m=state.modal;let body='';if(m.type==='create-campaign')body=`<h2>Criar campanha</h2><p class="lead">Você será o mestre. Um convite será gerado automaticamente.</p><form id="create-campaign"><label class="field">Nome da campanha<input name="name" required minlength="3" maxlength="90" placeholder="Ex.: Dunmoore: O Último Ano"></label><label class="field">Seu nome na mesa<input name="nick" required minlength="2" maxlength="50" placeholder="Ex.: Narrador" value="${esc(state.user?.user_metadata?.display_name||'')}"></label><div class="modal-footer"><button type="button" class="btn flat" data-action="close-modal">Cancelar</button><button type="submit" class="btn red">Criar mesa</button></div></form>`;
 if(m.type==='join-campaign')body=`<h2>Entrar na campanha</h2><p class="lead">Peça o código de acesso ao mestre.</p><form id="join-campaign"><label class="field">Código de convite<input name="code" required placeholder="CÓDIGO DA MESA" style="text-transform:uppercase" autocomplete="off"></label><label class="field">Seu nome na mesa<input name="nick" required minlength="2" maxlength="50" placeholder="Seu apelido" value="${esc(state.user?.user_metadata?.display_name||'')}"></label><div class="modal-footer"><button type="button" class="btn flat" data-action="close-modal">Cancelar</button><button type="submit" class="btn red">Entrar</button></div></form>`;
 if(m.type==='create-character'){let npc=isGM();body=`<h2>Novo sobrevivente</h2><p class="lead">Escolha uma classe com 10 pontos pré-definidos. Crie sua ficha ou um NPC para o arquivo.</p><form id="create-character"><div class="field-row"><label class="field">Nome<input name="name" required minlength="2" maxlength="90" value="${esc(m.random?.name||'')}" placeholder="Nome e sobrenome"></label><label class="field">Idade<input name="age" type="number" min="10" max="100" value="${m.random?.age||18}" required></label></div><label class="field">Classe<select name="class_key" id="class-picker">${CLASSES.map(c=>`<option value="${c[0]}" ${(m.random?.class_key||'ner')===c[0]?'selected':''}>${esc(c[1])}</option>`).join('')}</select></label><div id="class-preview" class="preview">${classSummary(m.random?.class_key||'ner')}</div><label class="field">Ocupação<input name="occupation" maxlength="120" value="${esc(m.random?.occupation||'')}" placeholder="Estudante, técnico, arquivista..."></label>${npc?`<label style="display:flex;align-items:center;gap:9px;margin:13px 0"><input type="checkbox" name="npc" checked style="width:19px;min-height:19px">Criar como NPC sem dono</label>`:''}<div class="row"><button type="button" class="btn flat small" data-action="random-fields">⚄ Preencher aleatoriamente</button></div><div class="modal-footer"><button type="button" class="btn flat" data-action="close-modal">Cancelar</button><button type="submit" class="btn red">Salvar sobrevivente</button></div></form>`}
 if(m.type==='grant'){const kind=m.kind||'item';body=`<h2>Conceder ${kind==='skill'?'habilidade':kind==='condition'?'condição':'item'}</h2><p class="lead">O recurso aparecerá na ficha selecionada dos jogadores conectados.</p><form id="grant-effect"><input name="character_id" type="hidden" value="${esc(m.id)}"><input name="kind" type="hidden" value="${esc(kind)}"><label class="field">Nome do recurso<input name="title" maxlength="80" minlength="2" required placeholder="Ex.: Chave da Ala Norte"></label><label class="field">Descrição<textarea name="details" maxlength="500" placeholder="Efeito e informações do recurso"></textarea></label><div class="modal-footer"><button type="button" class="btn flat" data-action="close-modal">Cancelar</button><button type="submit" class="btn red">Conceder à ficha</button></div></form>`}
 if(m.type==='edit-character'){const ch=state.characters.find(c=>c.id===m.id);if(ch){body=`<h2>Editar sobrevivente</h2><p class="lead">O retrato ficará salvo na ficha e sincronizado com os membros da campanha.</p><form id="edit-character"><input type="hidden" name="id" value="${ch.id}"><label class="field">Nome<input name="name" value="${esc(ch.name)}" maxlength="90" minlength="2" required></label><label class="field">Retrato (JPG, PNG ou WebP; até 8 MB)<input id="portrait-file" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="row"><div id="portrait-preview">${avatar(ch)}</div><button type="button" class="btn flat small" data-action="clear-portrait">Remover retrato</button></div><label class="field" style="margin-top:12px">Anotações do personagem (visíveis aos membros da mesa)<textarea name="notes" maxlength="5000" rows="5">${esc(ch.notes)}</textarea></label><div class="modal-footer"><button type="button" class="btn flat" data-action="close-modal">Cancelar</button><button type="submit" class="btn red">Salvar ficha</button></div></form>`}}
 if(m.type==='assign'){const ch=state.characters.find(c=>c.id===m.id);body=`<h2>Atribuir personagem</h2><p class="lead">Mude o dono da ficha de ${esc(ch?.name||'sobrevivente')} sem perder recursos e ferimentos.</p><form id="assign-character"><input name="id" type="hidden" value="${m.id}"><label class="field">Novo responsável<select name="owner_id"><option value="">NPC sem dono</option>${state.members.map(x=>`<option value="${x.user_id}" ${ch?.owner_id===x.user_id?'selected':''}>${esc(x.nickname)} (${x.role==='gm'?'mestre':'jogador'})</option>`).join('')}</select></label><div class="modal-footer"><button class="btn flat" type="button" data-action="close-modal">Cancelar</button><button class="btn red" type="submit">Confirmar</button></div></form>`}
 return `<div class="modal-backdrop" role="presentation" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="SLASHER: ${esc(m.type)}">${body}</section></div>`}
function classSummary(key){const a=PRESETS[key]||PRESETS.ner,p=cls(key);return `<div class="eyebrow">ATRIBUTOS PRÉ-DEFINIDOS · 10 PONTOS</div><div class="row" style="margin-top:9px">${ATTR.map(([k],i)=>`<span class="tag">${k} <b style="color:white">${a[i]}</b></span>`).join('')}</div><p class="hint" style="margin-top:9px"><b>${esc(p[2])}:</b> ${esc(p[3])} · HP/STA ${12+2*a[3]}</p>`}
function renderDiceOverlay(r,rolling=false){return `<div class="dice-shade" id="dice-overlay"><div class="dice-dialog"><div class="eyebrow">SLASHER / PROTOCOLO DE ROLAGEM</div><h2>${rolling?'O dado está girando...':'Resultado da rolagem'}</h2><div class="dice-box ${rolling?'roll':''}" id="dice-face">${rolling?'?':r.natural}</div>${rolling?`<p class="muted">O destino ainda não escolheu um número.</p>`:`<p class="result-total">${r.total}<span class="tiny muted"> total</span></p><p class="muted">D20 natural ${r.natural} ${r.modifier>=0?'+':'−'} ${Math.abs(r.modifier)} · ${esc(r.description||'Rolagem')}</p>${r.damage?`<p class="result-damage">Dano potencial: ${r.damage}</p>`:''}<button class="btn red wide" data-action="close-dice" style="margin-top:18px">Fechar resultado</button>`}</div></div>`}
function render(){const root=$('#app');if(!state.user){root.innerHTML=state.page==='settings'?window.SLASHER_SETTINGS.render({guest:true}):state.page==='p2p-join'?renderP2PJoin():renderLogin();window.SLASHER_CRT?.sync?.();window.SLASHER_SFX?.sync?.();return}let page=state.page;if(!state.campaign&&page!=='settings')page='lobby';const components={lobby:renderLobby,'p2p-room':renderP2PRoom,mesa:()=>window.SLASHER71.render(state),dashboard:renderDashboard,characters:renderCharacters,sheet:renderSheet,dice:renderDice,gm:renderGm,rules:renderRules,settings:()=>window.SLASHER_SETTINGS.render()};root.innerHTML=renderShell((components[page]||renderLobby)())+renderModal();updateConnectionStatus();state._mesaRender=render;if(page==='mesa')window.SLASHER71.attachDrag(state);if(page==='settings'){window.SLASHER_CRT?.sync?.();window.SLASHER_SFX?.sync?.()}}
// ---- Fluxos da mesa e interações ----
async function loadLobby(){state.campaigns=await api.listCampaigns();state.campaign=null;state.campaignId=null;state.characters=[];state.effects=[];state.selected=null;state.page='lobby';if(api.unsubscribe)api.unsubscribe();render()}
async function openCampaign(id){if(api.unsubscribe)api.unsubscribe();state.campaignId=id;state.page='mesa';await refreshCampaign(true);if(api.subscribe)api.subscribe(id,()=>{clearTimeout(syncTimer);syncTimer=setTimeout(()=>refreshCampaign(false).catch(e=>console.error(e)),300)})}
let syncTimer=null,refreshing=false;
async function refreshCampaign(force=false){if(!state.campaignId||refreshing)return;refreshing=true;try{const payload=await api.loadCampaign(state.campaignId);if(!payload?.campaign)throw Error('Campanha não encontrada ou acesso revogado');Object.assign(state,payload);await window.SLASHER71.load(state,api);if(!state.characters.some(c=>c.id===state.selected))state.selected=state.characters[0]?.id||null;
 const editing=!force&&(state.modal||document.activeElement?.closest('form')||document.activeElement?.id==='gm-note'||state.page==='settings');if(!editing)render();else updateConnectionStatus();if(state.mode==='p2p-host')broadcastP2P();}finally{refreshing=false}}
async function syncAction(cb,notice='Alteração salva e sincronizada.'){try{await cb();if(state.campaignId)await refreshCampaign(true);else await loadLobby();if(notice)toast(notice)}catch(e){console.error(e);toast('Erro: '+safeErr(e))}}
function randomChar(){return {name:sample(NAMES),class_key:sample(CLASSES)[0],age:16+Math.floor(Math.random()*35),occupation:sample(OCC),hook:sample(HOOKS)}}
async function randomNpc(){if(!isGM())throw Error('Somente o mestre pode criar NPCs');const info=randomChar(),id=await api.createCharacter({campaign_id:state.campaignId,name:info.name,class_key:info.class_key,age:info.age,occupation:info.occupation,npc:true});const note=state.gmNote+(state.gmNote?'\n\n':'')+`NPC: ${info.name}\nSegredo: ${info.hook}`;await api.saveNote(note);state.selected=id;await refreshCampaign(true);toast(`NPC ${info.name} criado. Seu segredo está no caderno do mestre.`)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copiado para a área de transferência.')}catch{window.prompt('Copie o código de convite:',text)}}
function openDiceOverlay(r){$('#dice-overlay')?.remove();document.body.insertAdjacentHTML('beforeend',renderDiceOverlay(r))}
function executeRoll(p){
 if($('#dice-overlay'))return;
 const local=window.SLASHER_DICE.build(p);
 const optimistic={...p,...local,description:p.description,created_at:new Date().toISOString(),id:'local-'+Date.now()};
 document.body.insertAdjacentHTML('beforeend',renderDiceOverlay(null,true));
 const face=$('#dice-face');let n=1;
 const spin=setInterval(()=>{if(face?.isConnected)face.textContent=String(n++%20+1)},50);
 let statusText='⟳ Sincronizando com a mesa...',failed=false;
 const status=()=>{const el=$('#dice-sync-note');if(el){el.textContent=statusText;el.classList.toggle('error',failed)}};
 const sync=api.roll({...p,clientDice:local}).then(saved=>{
   statusText='✓ Resultado registrado na mesa';
   if(state.campaignId===p.campaign_id){state.rolls=[saved,...state.rolls.filter(r=>r.id!==saved.id)].slice(0,80)}
   status();return saved;
 }).catch(e=>{
   failed=true;statusText='⚠ Não sincronizado. A rolagem não entrou no histórico.';
   status();console.error('Falha ao sincronizar D20:',e);toast('Rolagem não registrada: '+safeErr(e));return null;
 });
 setTimeout(()=>{
  clearInterval(spin);
  if(!$('#dice-overlay'))return;
  if(state.mode==='p2p-client') {sync.then(result=>{if(result&&$('#dice-overlay'))openDiceOverlay(result)});return;}
  openDiceOverlay(optimistic);
  const dialog=$('#dice-overlay .dice-dialog');if(dialog)dialog.insertAdjacentHTML('beforeend','<p class="dice-sync-note" id="dice-sync-note"></p>');
  status();
 },480);
 return sync;
}
function photoCompress(file){return new Promise((resolve,reject)=>{if(!file) return resolve(null);if(!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(Error('Somente JPG, PNG ou WebP.'));if(file.size>8*1024*1024)return reject(Error('Imagem maior que 8 MB.'));const url=URL.createObjectURL(file);const img=new Image();img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Não foi possível abrir a imagem.'))};img.onload=()=>{URL.revokeObjectURL(url);try{const ratio=Math.min(1,320/img.width,390/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#151519';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.72);if(data.length>149000)data=canvas.toDataURL('image/jpeg',.48);if(data.length>149000)throw Error('Imagem ainda é grande demais.');resolve(data)}catch(e){reject(e)}};img.src=url})}

document.addEventListener('click',async e=>{
 if(e.target.id==='modal-backdrop'){state.modal=null;render();return}
 const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const act=btn.dataset.action,val=btn.dataset.value,id=btn.dataset.id;
 try{
 if(act.startsWith('mesa-')){btn.disabled=true;await window.SLASHER71.action(act,btn,{state,api,refreshCampaign,render,toast});return}
 switch(act){
 case 'p2p-host':state.mode='p2p-host';state.user=api.me;await loadLobby();return;
 case 'p2p-join':state.page='p2p-join';render();return;
 case 'p2p-back':p2pAnswer='';p2pWait='';state.page='lobby';render();return;
 case 'p2p-offer':if(state.mode!=='p2p-host'||!state.campaignId)throw Error('Abra uma campanha primeiro');p2pOffer=await P2P.hostOffer();render();return;
 case 'p2p-accept':if(state.mode!=='p2p-host')throw Error('Apenas o mestre pode aceitar');await P2P.acceptAnswer($('#p2p-response-code')?.value.trim());toast('Resposta aceita. Aguardando o jogador conectar.');render();return;
 case 'p2p-copy':{const field=document.getElementById(btn.dataset.target);if(field)await copyText(field.value);return}
 case 'p2p-export':downloadP2PBackup();return;
 case 'demo-enter':state.user=api.me;await loadLobby();return;
 case 'demo-reset':{if(!confirm('Apagar os dados locais da demonstração e restaurar fichas?'))return;try{localStorage.removeItem(NOCACHE)}catch{};await api.init();state.user=null;render();return}
 case 'auth-tab':state.authTab=val;render();return;
 case 'logout':if(state.mode==='p2p-host'||state.mode==='p2p-client'){if(state.mode==='p2p-host'&&P2P.peers().length&&!confirm('Encerrar as conexões dos jogadores?'))return;P2P.close();location.reload();return;}if(state.mode==='online'&&state.user?.is_anonymous&&!confirm('Esta conta está vinculada ao navegador. Sair pode fazer você perder acesso às fichas. Continuar?'))return;await api.logout();state.user=null;state.campaign=null;state.campaignId=null;state.page='lobby';api.unsubscribe?.();render();return;
 case 'switch-role':{state.gmPreview=!state.gmPreview;state.user=state.gmPreview?{id:'demo-player',email:'jogador@dunmoore.demo'}:{id:'demo-gm',email:'mestre@dunmoore.demo'};api.me=state.user;if(state.page==='gm'&&state.gmPreview)state.page='sheet';render();return}
 case 'go':if(val==='p2p-room'&&!state.campaignId)throw Error('Abra uma campanha antes de criar um convite');if(val==='gm'&&!isGM())throw Error('Apenas o mestre pode usar este painel');state.page=val;state.modal=null;render();return;
 case 'open-campaign':await openCampaign(id);return;
 case 'modal':if(val==='grant'&&!isGM())throw Error('Somente o mestre pode conceder itens');if(val==='edit-character'&&!canEdit(state.characters.find(c=>c.id===id)))throw Error('Ficha protegida');state.modal={type:val,id,kind:btn.dataset.kind,portraitData:null};render();return;
 case 'close-modal':state.modal=null;render();return;
 case 'select-char':state.selected=id;state.page='sheet';render();return;
 case 'random-npc':await randomNpc();return;
 case 'random-fields':{const form=$('#create-character');if(!form)return;const a=randomChar();form.elements.name.value=a.name;form.elements.age.value=a.age;form.elements.class_key.value=a.class_key;form.elements.occupation.value=a.occupation;$('#class-preview').innerHTML=classSummary(a.class_key);return}
 case 'copy-invite':await copyText(state.campaign.invite_code);return;
 case 'clear-portrait':{if(!state.modal)return;state.modal.portraitData='';const el=$('#portrait-preview');if(el)el.innerHTML='<div class="avatar">?</div>';const file=$('#portrait-file');if(file)file.value='';return}
 case 'stat':{if(!isGM())throw Error('Somente o mestre pode alterar indicadores');btn.disabled=true;await syncAction(()=>api.changeStat(id,btn.dataset.stat,Number(btn.dataset.delta)));return}
 case 'set-clock':{if(!isGM())throw Error('Somente o mestre controla os relógios');const key=btn.dataset.key;let newValue=Number(val);if(state.campaign[key]===newValue)newValue=Math.max(0,newValue-1);btn.disabled=true;await syncAction(()=>api.setClock(key,newValue),'Relógio da cidade atualizado.');return}
 case 'save-gm-note':{if(!isGM())throw Error('Sem acesso');const v=$('#gm-note').value;btn.disabled=true;await syncAction(()=>api.saveNote(v),'Nota secreta salva.');return}
 case 'remove-effect':{if(!isGM())throw Error('Somente o mestre remove recursos');if(!confirm('Remover este recurso da ficha?'))return;btn.disabled=true;await syncAction(()=>api.removeEffect(id),'Recurso removido da ficha.');return}
 case 'close-dice':$('#dice-overlay')?.remove();return;
 }
 }catch(err){console.error(err);toast('Erro: '+safeErr(err));btn.disabled=false}
});
document.addEventListener('change',async e=>{
 if(e.target.id==='p2p-backup-file'){try{await restoreP2PBackup(e.target.files?.[0])}catch(err){toast('Backup: '+safeErr(err))}return}
 if(e.target.id==='sheet-picker'||e.target.id==='gm-picker'){state.selected=e.target.value;render();return}
 if(e.target.id==='class-picker'){$('#class-preview').innerHTML=classSummary(e.target.value);return}
 if(e.target.id==='m71-focus'){window.SLASHER71.focusChanged(state,e.target.value);render();return}
 if(e.target.id==='portrait-file'){
  try{const data=await photoCompress(e.target.files[0]);if(!state.modal||state.modal.type!=='edit-character')return;state.modal.portraitData=data;$('#portrait-preview').innerHTML=`<div class="avatar"><img alt="Prévia do retrato" src="${esc(data)}"></div>`;toast('Retrato preparado. Clique em salvar ficha para sincronizar.')}catch(err){toast(safeErr(err));e.target.value=''}
 }
});

document.addEventListener('submit',async e=>{
 e.preventDefault();const form=e.target;const formId=form.getAttribute('id');if(!formId&&!form.dataset.mesaForm)return;const dat=Object.fromEntries(new FormData(form).entries());const submit=form.querySelector('button[type=submit]');if(submit?.disabled)return;if(submit)submit.disabled=true;
 try{
 if(form.dataset.mesaForm){await window.SLASHER71.submit(form,{state,api,refreshCampaign,render,toast},e.submitter);return}
 if(formId==='p2p-join-form'){p2pNickname=safeInput(dat.nick,32);p2pWait='Aguardando o mestre aceitar a conexão...';p2pAnswer=await P2P.joinOffer(String(dat.offer||'').trim(),p2pNickname);render();return;}
 if(formId==='quick-auth-form'){
  if(state.mode!=='online')throw Error('Acesso rápido indisponível na demonstração');const result=await api.anonymousAuth(dat.nickname);state.user=result.user;await loadLobby();toast('Acesso criado como '+dat.nickname);return;
 }
 if(formId==='auth-form'){
 const result=await api.auth(state.authTab,dat.email,dat.password);if(result.session){state.user=result.user;await loadLobby()}else{state.authTab='login';render();toast('Cadastro recebido. Confira seu e-mail para confirmar a conta.')}return;
 }
 if(formId==='create-campaign'){const id=await api.createCampaign(dat.name,dat.nick);state.modal=null;await openCampaign(id);toast('Campanha criada. Compartilhe o código de convite.');return}
 if(formId==='join-campaign'){const id=await api.joinCampaign(dat.code,dat.nick);state.modal=null;await openCampaign(id);toast('Você entrou na campanha.');return}
 if(formId==='create-character'){
 const id=await api.createCharacter({campaign_id:state.campaignId,name:dat.name.trim(),class_key:dat.class_key,age:Number(dat.age),occupation:dat.occupation?.trim()||'',npc:!!dat.npc&&isGM()});state.selected=id;state.modal=null;state.page='sheet';await refreshCampaign(true);toast('Sobrevivente adicionado ao arquivo.');return;
 }
 if(formId==='grant-effect'){if(!isGM())throw Error('Apenas o mestre pode conceder recursos');await api.grantEffect(dat.character_id,dat.kind,dat.title.trim(),dat.details.trim());state.modal=null;await refreshCampaign(true);toast('Recurso concedido e sincronizado.');return}
 if(formId==='assign-character'){if(!isGM())throw Error('Apenas o mestre atribui fichas');await api.assignCharacter(dat.id,dat.owner_id||null);state.modal=null;await refreshCampaign(true);toast('Responsável pela ficha atualizado.');return}
 if(formId==='edit-character'){
 const ch=state.characters.find(c=>c.id===dat.id);if(!canEdit(ch))throw Error('Você não pode editar esta ficha');const portrait=state.modal?.portraitData??ch.portrait;
 await api.updateCharacter({id:ch.id,name:dat.name.trim(),notes:dat.notes,portrait});state.modal=null;await refreshCampaign(true);toast('Ficha e retrato salvos.');return;
 }
 if(formId==='dice-form'){
 const kind=dat.kind;if(kind==='monster'&&!isGM())throw Error('Somente o mestre pode rolar por monstros');const char=state.characters.find(c=>c.id===dat.character_id);if(char&&!canEdit(char))throw Error('Esta ficha não pertence a você');const modifier=(kind==='monster'||dat.attribute==='none'?0:Number(char?.attrs[dat.attribute]||0))+Number(dat.circumstance);
 const p={campaign_id:state.campaignId,character_id:kind==='monster'?null:dat.character_id||null,kind,description:String(dat.description||'').trim()||rollDescription(kind,dat.attribute,char?.name),modifier,damage_sides:kind==='test'?0:Number(dat.damage_sides)};
 await executeRoll(p);return;
 }
 }catch(err){console.error(err);toast('Erro: '+safeErr(err))}finally{if(submit?.isConnected)submit.disabled=false}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dice-overlay')){$('#dice-overlay').remove();return}if(state.modal){state.modal=null;render()}}});
window.addEventListener('storage',e=>{if(state.mode==='demo'&&e.key===NOCACHE&&state.user){try{api.data=JSON.parse(e.newValue);if(state.campaignId)refreshCampaign(false);else loadLobby()}catch{}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.campaignId&&state.mode==='online')refreshCampaign(false).catch(console.error)});
setInterval(()=>{if(!document.hidden&&state.campaignId&&state.mode==='online')refreshCampaign(false).catch(console.error)},20000);
(async()=>{try{const user=await api.init();state.user=state.mode==='demo'?null:user;if(user&&state.mode==='online')await loadLobby();else render()}catch(e){console.error(e);$('#app').innerHTML=`<div class="login-side" style="min-height:100vh"><div class="panel"><h2>Falha de conexão</h2><p>${esc(safeErr(e))}</p><p class="hint">Verifique config.js, o banco e a conexão com a internet.</p><button class="btn red" onclick="location.reload()">Tentar novamente</button></div></div>`}})();

</script>
