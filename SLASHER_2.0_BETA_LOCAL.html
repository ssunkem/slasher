/* 7.1 · Criatura clicável como alvo (teclado, toque, mouse) */
.m71-target-prompt{font-size:12px;color:#d9bec4;margin:14px 0 7px;letter-spacing:.02em}
button.m71-combatant.m71-target{display:flex;width:100%;min-width:0;min-height:78px;text-align:left;cursor:pointer;position:relative;appearance:none;transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease,transform .18s ease}
button.m71-target:not(:disabled):hover{border-color:#b43b54;background:#231016;transform:translateY(-1px)}
button.m71-target:focus-visible{outline:2px solid #f26881;outline-offset:3px}
button.m71-target.selected,button.m71-target.selected:hover{border:2px solid #e0435a;background:linear-gradient(110deg,#32131d,#1a0d13);box-shadow:0 0 0 2px #911d3540,0 0 18px #be273744}
button.m71-target.selected:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#e0435a}

@media(max-width:600px){.m71-target-heading{align-items:start;flex-direction:column}.m71-target-label{font-size:9px}}
@media(prefers-reduced-motion:reduce){button.m71-combatant.m71-target{transition:none}button.m71-target:not(:disabled):hover{transform:none}}

/* === p2p.css === */
/* SLASHER / P2P room UX. Does not modify CRT/SFX settings. */
.ambient-scene { position:fixed!important; inset:0!important; height:100vh!important; width:100%!important; min-height:0!important; margin:0!important; pointer-events:none!important; }
#app { position:relative; z-index:2; }
.login-shell { min-height:100vh; }
#p2p-offer-code,#p2p-response-code,#p2p-answer,textarea[name="offer"] {
  width:100%; font:12px/1.55 ui-monospace,Consolas,"Courier New",monospace!important;
  overflow-wrap:anywhere; word-break:break-all; resize:vertical; min-height:106px;
  color:#dbe4fb!important; border-color:rgba(80,109,188,.7)!important;
}
button[data-action^="p2p-"]:focus-visible,
#p2p-backup-file:focus-visible,
textarea[name="offer"]:focus-visible,
#p2p-response-code:focus-visible { outline:2px solid #76baff; outline-offset:3px; }
.login-card .panel.stack p.hint { line-height:1.55; }
@media(max-width:760px) {
  #p2p-offer-code,#p2p-response-code,#p2p-answer,textarea[name="offer"] { min-height:96px; font-size:11px!important; }
}
/* Keep the oversized archival numeral inside the hero; no blank scroll area beneath the screen. */
body .login-hero { overflow:hidden!important; }
body .ambient-scene { overflow:hidden!important; }

/* Diagnóstico de conexão P2P para mestre e jogador */
.p2p-diagnostic{border:1px solid #38577e;padding:12px 14px;background:rgba(9,19,34,.75);font-size:14px;line-height:1.5;color:#dce8fa;overflow-wrap:anywhere}
.p2p-diagnostic strong{display:block;font-weight:600;margin-bottom:3px;color:#b3d0ff}
.p2p-diagnostic small{display:block;font:11px/1.5 ui-monospace,monospace;color:#8e9fb9;margin-top:5px}
.p2p-diagnostic-error{border-color:#9a3547;background:rgba(42,10,17,.82);color:#f6c6ce}
.p2p-diagnostic-error strong{color:#f8afbb}

/* Cloudflare short-code joining */
.p2p-short-field{font:600 clamp(24px,4vw,34px)/1.25 Georgia,serif!important;letter-spacing:.16em!important;text-align:center;max-width:100%;color:#b4ffba!important;background:#050a0a!important;border:1px solid #316647!important;text-transform:uppercase!important;padding:13px!important}
.p2p-short-invite{padding:18px;display:grid;gap:11px;border:1px solid #36644a;background:rgba(3,18,12,.5);text-align:center}
.p2p-legacy{border-top:1px solid #28436a;padding-top:12px;margin-top:14px}
.p2p-legacy summary{cursor:pointer;color:#b8c3d8;padding:10px 0;font-size:14px}
.p2p-legacy form{display:grid;gap:12px;margin-top:14px}
.p2p-legacy textarea{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all}

/* Informações técnicas acessíveis sem ocupar a interface principal. */
.p2p-technical{margin-top:9px;border-top:1px solid rgba(134,170,208,.24);padding-top:7px}
.p2p-technical summary{font-size:12px;color:#abc5e8;cursor:pointer;list-style:revert}
.p2p-technical summary:focus-visible{outline:2px solid #76baff;outline-offset:3px}
.p2p-technical small{margin-top:8px}

/* === crt.css === */
/* SLASHER CRT / subtle scanlines, phosphor, and analog display finish.
   Entirely visual: never filters or degrades actual game text/images. */
body::before { opacity: 0 !important; } /* disable original unconfigurable scanlines */
.crt-screen { --crt-lines:.3;--crt-shadow:.38;--crt-triad:.16;--crt-noise:.047;--crt-beam:.12;
  position:fixed;inset:0;z-index:2147483000;pointer-events:none;isolation:isolate;
  contain:paint;
}
.crt-screen>div {position:absolute;inset:0;pointer-events:none}
.crt-scanlines {background:repeating-linear-gradient(to bottom,rgba(0,0,0,.75) 0 1px,transparent 1px 4px);opacity:var(--crt-lines)}
.crt-phosphor {background:repeating-linear-gradient(to right,rgba(245,48,75,.17) 0 1px,rgba(75,245,150,.13) 1px 2px,rgba(62,116,255,.18) 2px 3px);opacity:var(--crt-triad);mix-blend-mode:screen}
.crt-vignette {background:radial-gradient(ellipse 87% 81% at 50% 46%,transparent 42%,rgba(0,1,5,.10) 67%,rgba(0,1,4,.84) 100%);opacity:var(--crt-shadow)}
.crt-noise {background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.6' filter='url(%23n)'/%3E%3C/svg%3E");background-size:145px 145px;opacity:var(--crt-noise);mix-blend-mode:screen;animation:crtGrain 7s steps(5,end) infinite}
.crt-beam {top:-45%;height:34%;inset-inline:0;background:linear-gradient(to bottom,transparent,rgba(156,206,239,.035) 47%,rgba(196,224,245,.13) 50%,transparent);opacity:var(--crt-beam);animation:crtRoll 19s linear infinite}
.crt-screen[data-mode='soft']{--crt-lines:.15;--crt-shadow:.24;--crt-triad:.09;--crt-noise:.025;--crt-beam:.05}
.crt-screen[data-mode='classic']{--crt-lines:.30;--crt-shadow:.38;--crt-triad:.16;--crt-noise:.047;--crt-beam:.12}
.crt-screen[data-mode='strong']{--crt-lines:.54;--crt-shadow:.64;--crt-triad:.32;--crt-noise:.085;--crt-beam:.27}
.crt-screen[data-mode='off']{display:none}
@keyframes crtRoll{0%{transform:translateY(-40vh)}100%{transform:translateY(165vh)}}
@keyframes crtGrain{0%{background-position:0 0}25%{background-position:-26px 10px}50%{background-position:22px -18px}75%{background-position:4px 32px}100%{background-position:0 0}}
/* Deliberate chromatic fringing is reserved for hero-type headings, not small text. */
html[data-crt='classic'] .hero-title, html[data-crt='strong'] .hero-title,
html[data-crt='classic'] .brand .wordmark, html[data-crt='strong'] .brand .wordmark,
html[data-crt='classic'] .m71-page-title h2, html[data-crt='strong'] .m71-page-title h2 {
  text-shadow:-.65px 0 rgba(90,153,239,.35),.65px 0 rgba(141,207,138,.26),0 0 12px rgba(241,243,255,.1)
}
html[data-crt='strong'] .hero-title,html[data-crt='strong'] .brand .wordmark,html[data-crt='strong'] .m71-page-title h2 {
  text-shadow:-1px 0 rgba(90,153,239,.42),1px 0 rgba(141,207,138,.33),0 0 16px rgba(241,243,255,.12)
}
.crt-control {position:fixed;z-index:2147483001;bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));font-family:ui-monospace,Consolas,monospace}
.crt-control button,.crt-control button:hover:not(:disabled){
  display:flex;gap:8px;align-items:center;justify-content:center;
  padding:9px 12px;min-height:42px;min-width:133px;
  background:rgba(2,5,11,.94)!important;color:#e4e9f5!important;
  border:1px solid rgba(60,91,169,.75)!important;box-shadow:0 4px 14px #000b, inset 0 0 14px rgba(44,66,134,.16)!important;
  border-radius:2px!important;font:600 11px/1.1 ui-monospace,Consolas,monospace!important;
  letter-spacing:.045em!important;text-transform:uppercase!important;
  backdrop-filter:blur(4px);cursor:pointer
}
.crt-control button:focus-visible {outline:2px solid #b4c9ff;outline-offset:4px}
.crt-control button:hover:not(:disabled){border-color:rgba(138,166,230,.92)!important;background:rgba(10,17,31,.96)!important}
.crt-led {display:block;flex:none;width:7px;height:7px;border-radius:50%;background:#60ba73;box-shadow:0 0 7px rgba(60,235,97,.65)}
html[data-crt='off'] .crt-led{background:#6c7383;box-shadow:none}
.crt-control small{display:none}
/* Full focus of menus remains intact: overlays never intercept taps or clicks. */
@media(max-width:600px){.crt-control{bottom:10px;right:10px}.crt-control button{min-width:109px!important;padding:8px!important;font-size:10px!important;min-height:40px!important}}
@media(prefers-reduced-motion: reduce){.crt-noise,.crt-beam{animation:none!important}.crt-beam{opacity:0!important}}
@media print{.crt-control,.crt-screen{display:none!important}}


/* SLASHER / brilho de fósforo e separação RGB ajustáveis, sem desfocar texto. */
:root{
 --crt-bloom-core:.19;
 --crt-bloom-halo:.13;
 --crt-bloom-border:.095;
 --crt-chroma-left:-.52px;
 --crt-chroma-right:.52px;
 --crt-chroma-alpha:.28;
}
/* Highlights apenas em títulos grandes. A cromática não alcança textos pequenos. */
html:not([data-crt='off']) .hero-title,
html:not([data-crt='off']) .brand .wordmark,
html:not([data-crt='off']) .m71-page-title h2,
html:not([data-crt='off']) .login-card h2,
html:not([data-crt='off']) .hero-panel h2 {
 text-shadow:
  var(--crt-chroma-left) 0 0 rgba(231,65,94,var(--crt-chroma-alpha)),
  var(--crt-chroma-right) 0 0 rgba(58,132,246,var(--crt-chroma-alpha)),
  0 0 7px rgba(243,246,255,var(--crt-bloom-core)),
  0 0 25px rgba(119,141,255,var(--crt-bloom-halo));
}
html:not([data-crt='off']) .m71-dock-title h3,
html:not([data-crt='off']) .m71-stock-price strong,
html:not([data-crt='off']) .m71-shop-title,
html:not([data-crt='off']) .m71-hero-copy h2,
html:not([data-crt='off']) .m71-no-combat h3 {
 text-shadow:
  var(--crt-chroma-left) 0 0 rgba(225,67,104,var(--crt-chroma-alpha)),
  var(--crt-chroma-right) 0 0 rgba(53,139,246,var(--crt-chroma-alpha)),
  0 0 12px rgba(223,229,249,var(--crt-bloom-core));
}
/* Glow sobre elementos interativos selecionados, nunca sobre erros/ferimentos. */
html:not([data-crt='off']) .btn.red,
html:not([data-crt='off']) .side-nav button.active,
html:not([data-crt='off']) button.m71-target.selected,
html:not([data-crt='off']) .m71-stock-price {
 box-shadow:
  var(--crt-chroma-left) 0 0 rgba(225,65,93,var(--crt-chroma-alpha)),
  var(--crt-chroma-right) 0 0 rgba(48,126,255,var(--crt-chroma-alpha)),
  0 0 18px rgba(83,133,244,var(--crt-bloom-border)),
  inset 0 0 12px rgba(158,204,255,var(--crt-bloom-border))!important;
}
html:not([data-crt='off']) .m71-dock-title>span,
html:not([data-crt='off']) .accent,
html:not([data-crt='off']) .m71-item-icon,
html:not([data-crt='off']) .crt-led {
 filter:drop-shadow(0 0 7px rgba(121,168,255,var(--crt-bloom-core)));
}
/* Um halo ambiental difuso por trás da interface, sem processamento de tela cheia. */
.crt-glow-field {
 position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse 75% 42% at 50% 7%,rgba(125,157,255,var(--crt-bloom-halo)),transparent 75%);
 mix-blend-mode:screen;
}
.crt-screen[data-mode='off'] .crt-glow-field{display:none}
/* Controle secundário, independente do seletor de intensidade CRT. */
.crt-control-row{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.crt-control #slasher-fx-toggle,
.crt-control #slasher-fx-toggle:hover:not(:disabled){min-width:57px!important;min-height:42px!important;padding:9px!important}
.crt-control #slasher-fx-toggle[aria-expanded='true']{border-color:#73a2df!important;box-shadow:0 0 16px rgba(65,94,196,.35)!important}
.crt-fx-panel{
 position:absolute;right:0;bottom:calc(100% + 11px);width:min(320px,calc(100vw - 24px));
 background:rgba(3,6,14,.97);border:1px solid rgba(73,100,174,.88);
 padding:16px;display:grid;gap:16px;color:#e8eaf0;
 box-shadow:0 16px 40px rgba(0,0,0,.85), inset 0 0 22px rgba(39,55,111,.16);
 border-radius:0;backdrop-filter:blur(8px)
}
.crt-fx-panel[hidden]{display:none!important}
.crt-fx-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid rgba(67,94,161,.5);padding-bottom:10px}
.crt-fx-head strong{font:400 18px/1.1 Georgia,'Times New Roman',serif;letter-spacing:.09em}
.crt-fx-head small{font:10px/1.2 ui-monospace,Consolas,monospace;color:#93a0bd}
.crt-fx-field{display:grid;gap:8px;color:#e4e7ee;font:13px/1.4 Georgia,'Times New Roman',serif!important}
.crt-fx-field>span{display:flex;align-items:center;justify-content:space-between;gap:12px}
.crt-fx-field output{font:12px ui-monospace,Consolas,monospace;color:#9dbaed}
.crt-fx-field input[type='range']{appearance:auto!important;display:block;width:100%;min-height:26px!important;box-shadow:none!important;padding:0!important;border:0!important;background:transparent!important;accent-color:#77a7ed;cursor:pointer}
.crt-fx-info{font:11px/1.5 ui-monospace,Consolas,monospace;color:#919eaf;margin:0}
.crt-control .crt-fx-reset,
.crt-control .crt-fx-reset:hover:not(:disabled){min-width:0!important;min-height:34px!important;justify-self:start;padding:7px 12px!important;color:#bbc6e3!important;letter-spacing:.05em!important}
@media(max-width:600px){.crt-control #slasher-fx-toggle{min-width:48px!important;padding:8px!important}.crt-fx-panel{padding:14px}}
@media print{.crt-fx-panel{display:none!important}}

/* === sfx.css === */
/* SLASHER / UI Audio controls, beside the CRT presets. */
.crt-control #slasher-audio-toggle,
.crt-control #slasher-audio-toggle:hover:not(:disabled){min-width:62px!important;min-height:42px!important;padding:9px!important}
.crt-control #slasher-audio-toggle[aria-expanded='true']{border-color:#5a9b72!important;box-shadow:0 0 14px rgba(59,146,83,.3)!important}
.sfx-led{width:6px;height:6px;background:#667186;box-shadow:none;display:inline-block;flex:none;border-radius:50%}
.sfx-led[data-on='true']{background:#70ce86;box-shadow:0 0 10px rgba(93,224,123,.55)}
.sfx-panel{position:absolute;right:0;bottom:calc(100% + 11px);width:min(318px,calc(100vw - 24px));
 background:rgba(3,6,14,.98);border:1px solid rgba(73,100,174,.88);color:#e8eaf0;
 padding:16px;display:grid;gap:15px;box-shadow:0 16px 40px rgba(0,0,0,.85),inset 0 0 22px rgba(39,55,111,.16);backdrop-filter:blur(8px);border-radius:0}
.sfx-panel[hidden]{display:none!important}
.sfx-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(67,94,161,.5);padding-bottom:10px}
.sfx-header strong{font:400 19px/1.1 Georgia,'Times New Roman',serif;letter-spacing:.09em}
.sfx-header small{display:inline!important;font:10px ui-monospace,Consolas,monospace;color:#94a3bc}
.sfx-toggle-row{display:flex!important;align-items:center!important;gap:10px!important;font:13px Georgia,'Times New Roman',serif!important;color:#e4e7ee!important}
.sfx-toggle-row input{appearance:auto!important;width:19px!important;height:19px!important;min-height:19px!important;flex:none;accent-color:#72c18b!important;cursor:pointer}
.sfx-field{display:grid;gap:7px;color:#e4e7ee!important;font:13px/1.45 Georgia,'Times New Roman',serif!important}
.sfx-field>span{display:flex;justify-content:space-between;gap:12px}
.sfx-field output{font:12px ui-monospace,Consolas,monospace;color:#96b9d8}
.sfx-field input[type='range']{appearance:auto!important;display:block;width:100%!important;min-height:25px!important;box-shadow:none!important;padding:0!important;border:0!important;background:transparent!important;accent-color:#80b8d2!important;cursor:pointer}
.sfx-field input:disabled{opacity:.35}
.sfx-actions{display:flex;gap:8px;flex-wrap:wrap}
.crt-control .sfx-actions button,.crt-control .sfx-actions button:hover:not(:disabled){min-width:0!important;min-height:36px!important;flex:1 1 120px;padding:9px 10px!important;color:#dde4ef!important}
.sfx-help{font:11px/1.5 ui-monospace,Consolas,monospace;color:#a1aac0;margin:0}
@media(max-width:600px){.crt-control #slasher-audio-toggle{min-width:52px!important;padding:8px!important}.sfx-panel{padding:14px}.crt-control-row{gap:4px}}
@media print{.sfx-panel,#slasher-audio-toggle{display:none!important}}

/* === settings.css === */
/* The System Options page has its own layout, not a floating CRT/SFX menu. */
.settings-page{--opt-line:rgba(70,92,164,.64);--opt-ink:#e9ebef;--opt-muted:#a0a8b8;color:var(--opt-ink);max-width:1240px;margin:0 auto 60px;font-family:Georgia,'Times New Roman',serif;position:relative}
.settings-page *{box-sizing:border-box}
.settings-head{padding:18px 0 31px;border-bottom:1px solid rgba(72,91,150,.45);margin-bottom:27px}
.settings-kicker,.settings-serial,.settings-subtitle,.settings-chapters>span,.settings-end,.settings-screen-caption,.settings-status{font:600 10px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.17em;color:#8d9fc9;text-transform:uppercase}
.settings-head h1{font:400 clamp(39px,5vw,65px)/1.13 Georgia,'Times New Roman',serif;letter-spacing:.015em;color:#f0f0f1;text-shadow:-.5px 0 #ff679855,.7px 0 #70a3ff75,0 0 22px #b9c9ff2e;margin:14px 0}
.settings-blink{color:#4ebe83;animation:settingsBlink 1.55s step-end infinite}
@keyframes settingsBlink{50%{opacity:0}}
.settings-head p{font:15px/1.65 Georgia,serif;color:#aab1bd;max-width:65ch}
.settings-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.settings-chapters{position:sticky;top:104px;padding:20px 14px 18px;background:#02040adb;border:1px solid var(--opt-line);display:grid;gap:5px;box-shadow:inset 0 0 24px #0c1d3a29,0 8px 26px #0009}
.settings-chapters>span{margin:0 8px 12px}
.settings-chapters a{display:flex;gap:13px;align-items:center;text-decoration:none;padding:12px 10px;color:#b2bbcb!important;font:12px ui-monospace,Consolas,monospace;border:1px solid transparent!important;background:transparent!important;transition:background-color .15s,border-color .15s;color .15s}
.settings-chapters a b{flex:1;font-weight:500}
.settings-chapters a:hover,.settings-chapters a:focus-visible{border-color:#326e83aa!important;background:#10233699!important;color:#d5f4e2!important}
.settings-chapters a i{font-style:normal;color:#679e90}
.settings-chapters-foot{margin:22px 8px 0;padding-top:20px;border-top:1px solid #3347695e;font:10px/1.9 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:#697791}
.settings-stack{display:grid;gap:25px;min-width:0}
.settings-card{scroll-margin-top:104px;background:radial-gradient(ellipse at 100% 0,#15325c1e,transparent 47%),#010204e6;border:1px solid rgba(57,81,159,.74);position:relative;padding:clamp(16px,2.6vw,32px);box-shadow:inset 0 0 0 7px #030812, inset 0 0 0 8px #2d4c7630,0 20px 40px #0009}
.settings-card:before,.settings-card:after{content:'';position:absolute;width:13px;height:13px;border-top:1px solid #779fd6c7;border-left:1px solid #779fd6c7;top:-1px;left:-1px;pointer-events:none}
.settings-card:after{transform:rotate(180deg);left:auto;right:-1px;top:auto;bottom:-1px}
.settings-card-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px;padding-bottom:18px;border-bottom:1px solid #2a467f8c}
.settings-card-head h2{font:400 clamp(26px,3.5vw,37px)/1.2 Georgia,serif;margin:8px 0 0;color:#ecedf3}
.settings-card-head h2 span{font-style:italic;color:#a3b3d0}
.settings-status{border:1px solid #496f8b99;color:#9aceb5;padding:7px 10px;white-space:nowrap}
.settings-status[data-disabled='true']{border-color:#515b77;color:#8d96a4}
.settings-display-preview{position:relative;height:170px;background:#010202;border:1px solid #1f3062;margin-bottom:27px;overflow:hidden}
.settings-screen{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 80%,#16344a7a,transparent 58%),linear-gradient(180deg,#020307,#080d16 48%,#010203)}
.settings-screen:before{content:'';position:absolute;inset:0;z-index:4;background:repeating-linear-gradient(to bottom,#0008 0 1px,transparent 1px 4px),repeating-linear-gradient(to right,#c4334d14 0 1px,#2e9b6710 1px 2px,#376fb31a 2px 3px);opacity:.35;pointer-events:none}
.settings-screen:after{content:'';position:absolute;inset:0;z-index:5;background:radial-gradient(ellipse 80% 85%,transparent 45%,#000d 100%);pointer-events:none}
.settings-screen-haze{position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,transparent,#a7c8e010 50%,transparent);transform:skew(-15deg);filter:blur(14px)}
.settings-screen-marker,.settings-screen small{z-index:1;font:9px ui-monospace,Consolas,monospace;letter-spacing:.23em;color:#9fa9b5}
.settings-screen-title{z-index:1;font:400 clamp(29px,5vw,53px)/1 Georgia,serif;letter-spacing:.16em;color:#e3e9ed;text-shadow:-1px 0 #ff527669,1px 0 #3579e18c,0 0 18px #d0d9ff79}
.settings-screen-line{height:2px;width:22%;background:linear-gradient(90deg,transparent,#6fdd92b0,transparent);filter:blur(.3px);box-shadow:0 0 9px #6cbb9e72;z-index:1}
.settings-screen-caption{position:absolute;bottom:10px;right:15px;z-index:6;color:#7487a6}
.settings-subtitle{color:#b0b7c8;margin-bottom:12px}
.settings-mode-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:24px}

<script>
/* === signal-config.js === */
/* SLASHER 10.2 | URL PUBLICA do Worker Cloudflare. Nenhuma credencial privada aqui. */
window.SLASHER_SIGNAL_URL = "https://slasher-p2p.slasher-dunmoore.workers.dev";

<script>
/* === p2p.js === */
/* SLASHER P2P: manual WebRTC signaling, host authoritative game session.
   No Supabase / centralized signaling. Public STUN only, TURN not included.
   The host must keep this browser tab open. */
(function(){
 'use strict';
 const ICE={iceServers:[{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
 // Os convites NÃO têm TTL: gatheringTimeout e connectTimeout não expiram o código.
 const GATHER_MS=30000, CONNECT_MS=45000;
 const MAX_SIGNAL=35000,CHUNK=12000,MAX_MESSAGE=1200000;
 const NO_ROUTE='O navegador não encontrou rotas WebRTC. Confira se PC e celular estão na mesma rede Wi-Fi, sem VPN, e tente novamente. Em algumas redes é necessário um servidor TURN.';
 const hasRoute=sdp=>/^a=candidate:/m.test(String(sdp||''));
 const routeCount=sdp=>(String(sdp||'').match(/^a=candidate:/gm)||[]).length;
 // Contagem por tipo, sem revelar IP privado, mDNS ou endereco publico.
 const routeTypes=sdp=>{
  const groups={host:0,srflx:0,relay:0,prflx:0}, lines=String(sdp||'').split(/\r?\n/).filter(x=>x.startsWith('a=candidate:'));
  let mdns=0;
  for(const line of lines){const type=line.match(/\btyp (host|srflx|relay|prflx)\b/);if(type)groups[type[1]]++;if(/\.local(?:\s|$)/.test(line))mdns++;}
  const parts=Object.entries(groups).filter(([,n])=>n).map(([type,n])=>type+':'+n);
  return parts.length?parts.join(', ')+(mdns?' (mDNS:'+mdns+')':''):'nenhuma';
 };
 let diagnostic={phase:'idle',message:'Pronto para negociar a conexão.',candidateCount:0,ice:'new',connection:'new',channel:'novo',localRoutes:'nenhuma',remoteRoutes:'nenhuma'};
 const report=(phase,message,who)=>{diagnostic={phase,message,
  candidateCount:who?.candidateCount??diagnostic.candidateCount,
  ice:who?.pc?.iceConnectionState||diagnostic.ice,
  connection:who?.pc?.connectionState||diagnostic.connection,
  channel:who?who.dc?.readyState||'não criado':diagnostic.channel,
  localRoutes:who?.pc?routeTypes(who.pc.localDescription?.sdp):diagnostic.localRoutes,
  remoteRoutes:who?.pc?routeTypes(who.pc.remoteDescription?.sdp):diagnostic.remoteRoutes
 };callbacks.status?.({...diagnostic})};
 const pending=new Map(),live=new Map(),pendingRPC=new Map(),pieces=new Map();
 // Uma negociação manual pode aguardar o usuário copiar/colar a resposta.
 // Um ICE 'failed' antes da aplicação da resposta não equivale a convite expirado.
 const retire=who=>{if(!who)return;who.closed=true;clearTimeout(who.connectionTimer);try{who.dc?.close()}catch{}try{who.pc?.close()}catch{}};
 const uid=()=>crypto.randomUUID?.()||Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
 let client=null,requestSerial=0;
 const callbacks={};
 const signal=obj=>btoa(Array.from(new TextEncoder().encode(JSON.stringify(obj)),x=>String.fromCharCode(x)).join(''));
 function parse(code,type){
  if(!code||code.length>MAX_SIGNAL)throw Error('Código de conexão vazio ou grande demais');
  let value;
  try{const str=atob(code.replace(/\s/g,''));value=JSON.parse(new TextDecoder().decode(Uint8Array.from(str,c=>c.charCodeAt(0))))}catch{throw Error('Código de conexão inválido ou incompleto')}
  if(value.v!==1||value.type!==type||typeof value.sdp!=='string'||!value.sdp.startsWith('v=0')||value.sdp.length>25000||typeof value.id!=='string')throw Error('Código de conexão incompatível');
  if(!hasRoute(value.sdp))throw Error('O código recebido não contém rotas de conexão WebRTC. O outro navegador deve gerar um NOVO código. '+NO_ROUTE);
  return value;
 }
 function gather(pc){return new Promise((resolve,reject)=>{
  let finished=false;
  const finish=()=>{
   if(finished)return;
   finished=true;clearTimeout(timer);pc.removeEventListener('icegatheringstatechange',changed);
   const description=pc.localDescription?.sdp||'';
   hasRoute(description)?resolve(routeCount(description)):reject(Error(NO_ROUTE));
  };
  const changed=()=>{if(pc.iceGatheringState==='complete')finish()};
  // Some phones take longer to gather STUN candidates. If gathering stalls,
  // use the routes we already have instead of rejecting a usable LAN route.
  const timer=setTimeout(finish,GATHER_MS);
  pc.addEventListener('icegatheringstatechange',changed);
  changed();
 })}
 function watch(pc,who){
  const changed=()=>{
   if(who.closed)return; // Ignora callbacks de tentativas antigas.
   const state=pc.connectionState,ice=pc.iceConnectionState;
   if(state==='connected'){
    who.stage='connected';report('connected','Canal P2P conectado.',who);
   }else if(state==='failed'||ice==='failed'){
    if(who.role==='client'&&who.stage==='waiting-host'){
     // O cliente começa a testar ICE assim que cria o answer. Como o mestre
     // ainda precisa colar esse código, um erro ICE aqui é prematuro.
     report('waiting','Resposta gerada. ICE ainda sem conexão: envie o código ao mestre e peça que conclua. Se não conectar depois, gere convite e resposta novos.',who);
    }else if(who.role==='host'&&who.stage==='waiting-answer'){
     report('waiting','Convite criado. Aguardando a resposta do jogador; ICE ainda não foi concluído.',who);
    }else{
     report('error','Falha na negociação ICE depois da resposta. Tente gerar um convite novo. Desative VPN ou isolamento Wi-Fi; algumas redes exigem TURN.',who);
    }
   }else if(state==='disconnected'){
    if(who.stage==='connected')report('error','O outro navegador perdeu a conexão. Confira a rede dos dois aparelhos.',who);
   }else if(state==='connecting'||ice==='checking'){
    if(who.stage==='waiting-host')report('waiting','Resposta pronta. Aguardando o mestre aplicar o código... (ICE: '+ice+')',who);
    else if(who.stage==='waiting-answer')report('waiting','Convite gerado. Aguardando a resposta do jogador...',who);
    else report('connecting','Verificando caminho direto entre os navegadores...',who);
   }
  };
  pc.addEventListener('connectionstatechange',changed);
  pc.addEventListener('iceconnectionstatechange',changed);
 }

 function make(){if(!window.RTCPeerConnection)throw Error('Seu navegador não oferece WebRTC. Use uma versão atual do Firefox ou Chrome.');return new RTCPeerConnection(ICE)}
 function transmit(dc,message){if(!dc||dc.readyState!=='open')throw Error('O outro participante está desconectado');
  const text=JSON.stringify(message);if(text.length>MAX_MESSAGE)throw Error('Mensagem grande demais para P2P');
  const id=uid(),count=Math.ceil(text.length/CHUNK);
  for(let i=0;i<count;i++)dc.send(JSON.stringify({packet:id,index:i,total:count,payload:text.slice(i*CHUNK,(i+1)*CHUNK)}));
 }
 function listen(dc,who){
  dc.onmessage=event=>{
   try{
    const part=JSON.parse(event.data);
    if(!part||typeof part.packet!=='string'||part.packet.length>80||!Number.isInteger(part.index)||!Number.isInteger(part.total)||part.total<1||part.total>130||part.index<0||part.index>=part.total||typeof part.payload!=='string'||part.payload.length>CHUNK)throw Error('Pacote P2P inválido');
    const key=who.key+':'+part.packet;
    let data=pieces.get(key);
    if(!data){data={time:Date.now(),array:Array(part.total),count:0};pieces.set(key,data)}
    if(data.array.length!==part.total)throw Error('Pacote inconsistênte');
    if(data.array[part.index]===undefined){data.array[part.index]=part.payload;data.count++}
    if(data.count===part.total){pieces.delete(key);const msg=JSON.parse(data.array.join(''));received(who,msg)}
    if(pieces.size>80)for(const [k,p] of pieces)if(Date.now()-p.time>30000)pieces.delete(k);
   }catch(e){console.warn('SLASHER P2P pacote ignorado:',e)}
  };
  dc.onerror=()=>report('error','Erro no canal de dados. Gere um novo convite e tente novamente.',who);
  dc.onclose=()=>{if(who.closed)return;if(diagnostic.phase!=='error')report('error','Canal P2P fechado. Será necessário reconectar.',who);if(who.role==='host')live.delete(who.key);for(const [id,req] of pendingRPC)if(req.who===who){clearTimeout(req.timer);req.reject(Error('A conexão com o mestre caiu'));pendingRPC.delete(id)}callbacks.disconnected?.(who)};
 }
 function received(who,msg){
  if(!msg||typeof msg.type!=='string')return;
  if(who.role==='host'){
   if(msg.type==='hello'&&!who.id){report('connected','Jogador entrou na mesa!',who);who.id='peer-'+uid();who.nick=String(msg.nick||'Sobrevivente').trim().slice(0,32);if(who.nick.length<2)who.nick='Sobrevivente';live.set(who.key,who);transmit(who.dc,{type:'welcome',id:who.id,nick:who.nick});callbacks.hello?.(who);return}
   if(msg.type==='request'&&who.id&&typeof msg.reqid==='string'&&msg.reqid.length<100){Promise.resolve().then(()=>callbacks.request?.(who,msg.method,msg.args)).then(result=>transmit(who.dc,{type:'reply',reqid:msg.reqid,ok:true,result})).catch(e=>{try{transmit(who.dc,{type:'reply',reqid:msg.reqid,ok:false,error:String(e?.message||e)})}catch{}});return}
  }else{
   if(msg.type==='welcome'){report('connected','Conectado ao mestre! Aguardando os dados da campanha.',who);who.id=msg.id;callbacks.welcome?.(msg);return}
   if(msg.type==='snapshot'){callbacks.snapshot?.(msg.payload);return}
   if(msg.type==='reply'){const task=pendingRPC.get(msg.reqid);if(!task)return;clearTimeout(task.timer);pendingRPC.delete(msg.reqid);msg.ok?task.resolve(msg.result):task.reject(Error(msg.error||'Ação negada pelo mestre'));return}
  }
 }
 async function hostOffer(){
  // Não deixe um convite antigo gerar 'ICE failed' sobre o convite atual.
  for(const who of pending.values())retire(who);pending.clear();
  const pc=make(),id=uid(),key=id;let dc;
  try{
   dc=pc.createDataChannel('slasher-sync',{ordered:true});const who={key,pc,dc,role:'host',id:null,nick:null,stage:'gathering',closed:false};
   listen(dc,who);watch(pc,who);dc.onopen=()=>{clearTimeout(who.connectionTimer);who.stage='connected';report('connected','Canal aberto; aguardando apresentação do jogador...',who)};
   report('gathering','Descobrindo rotas de conexão do mestre...',who);
   const offer=await pc.createOffer();await pc.setLocalDescription(offer);who.candidateCount=await gather(pc);
   who.stage='waiting-answer';pending.set(id,who);report('offer','Convite pronto ('+who.candidateCount+' rotas). Sem TTL no SLASHER: mantenha esta aba aberta e peça a resposta ao jogador.',who);
   return signal({v:1,type:'offer',id,sdp:pc.localDescription.sdp});
  }catch(e){report('error',e.message||'Não foi possível gerar convite.');pc.close();throw e}
 }
 async function joinOffer(code,nick){
  let offer;try{offer=parse(code,'offer')}catch(e){report('error',e.message);throw e}

function parseCharacterForm(dat,previous={}){
 const history=R.pickHistory(dat.history);if(!history)throw Error('Histórico inválido');
 const extras=[dat.extra_0,dat.extra_1,dat.extra_2];
 if(new Set(extras).size!==3||extras.some(k=>!R.SKILLS.includes(k)||history.skills.includes(k)))throw Error('Escolha três competências adicionais diferentes das duas do histórico');
 const all=[...history.skills,...extras];
 if(!all.includes(dat.specialization))throw Error('Especialize uma das cinco competências escolhidas');
 const values=Object.fromEntries(Object.keys(R.ATTRIBUTES).map(k=>[k,Number(dat['attr_'+k])]));
 const skills=Object.fromEntries(all.map(k=>[k,k===dat.specialization?25:15]));
 const inventory=String(dat.inventory||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>{
  const bits=s.split('|');const name=bits[0].trim(),slots=Number(bits[1]),damageBase=Number(bits[2]||0);
  if(!name||!Number.isInteger(slots)||slots<1||slots>3)throw Error('Escreva cada item como "nome | espaços" (1 a 3)');
  if(!Number.isInteger(damageBase)||damageBase<0||damageBase>4)throw Error('Dano base deve estar entre 0 e 4');return {name,slots,damageBase};
 });
 const c=R.newCharacter({...previous,name:dat.name,age:Number(dat.age),occupation:dat.occupation,
 concept:dat.concept,traits:dat.traits,concern:dat.concern,attrs:values,history:dat.history,
 skills,contact:dat.contact,bonds:[dat.bond_0,dat.bond_1,dat.bond_2],home:dat.home,
 responsibility:dat.responsibility,meaningfulItem:dat.meaningfulItem,inventory,notes:dat.notes},{allowOverload:previous?.schemaVersion===R.VERSION});
 if(previous?.schemaVersion===R.VERSION){
  for(const k of ['id','campaign_id','owner_id','vitality','vitalityMax','stamina','staminaMax','tension','preparations','wounds','deathRisk','marks','development','portrait'])c[k]=previous[k];
 }

}

function dashboard(s,isGM){

 '<section class="hero-panel"><div><div class="eyebrow">SLASHER · EDIÇÃO DE TESTE I</div><h2>A cidade não esquece.</h2><p>Investigue primeiro. A violência é uma escolha com consequências.</p><div class="row"><button class="btn red" data-action="go" data-value="investigation">Arquivo de investigação</button><button class="btn flat" data-action="go" data-value="dice">Rolar D100</button></div></div></section>'+

function gm(s,ch){

 '<div class="grid2">'+clock('suspicion','Suspeita da Cidade',6)+clock('danger','Perigo do Local',4)+'</div>'+

 (editable?'<div class="stack">'+[['vitality','Vitalidade',ch.vitality,6],['stamina','Fôlego',ch.stamina,5],['tension','Tensão',ch.tension,6],['preparations','Preparo',ch.preparations,2],['development','Desenvolvimento',ch.development,999],['deathRisk','Risco de Morte',ch.deathRisk,3]].map(([k,label,value,max])=>
 '<div class="between"><span>'+label+' · '+value+' / '+max+'</span><div class="row"><button class="btn small flat" data-action="stat" data-id="'+esc(ch.id)+'" data-stat="'+k+'" data-delta="-1">−1</button><button class="btn small flat" data-action="stat" data-id="'+esc(ch.id)+'" data-stat="'+k+'" data-delta="1">+1</button></div></div>').join('')+'</div>':'<p class="hint">Selecione uma ficha da edição 2.0 para alterar recursos.</p>')+'</div>'+
 '<div class="panel"><h3>Notas secretas da campanha</h3><textarea id="gm-note" rows="6">'+esc(s.gmNote||'')+'</textarea><button class="btn red" data-action="save-gm-note">Salvar notas</button></div>';
}
function rules(){
 return '<header class="section-head"><div><div class="eyebrow">SLASHER / LIVRO BÁSICO</div><h2>Regras rápidas · Edição de Teste I</h2><p>Este resumo substitui o manual da edição VI; consulte o PDF oficial da edição atual para detalhes.</p></div></header>'+
 '<div class="rules-grid">'+[
 ['ROLAGEM','d100 ≤ Alvo. Alvo = atributo + treinamento + circunstâncias (mínimo 10, máximo 90).'],
 ['DIFICULDADE','Normal = Alvo; Difícil = metade; Extremo = um quinto.'],
 ['GRAUS','Até metade: Forte; até um quinto: Extraordinário. 01: Virada; 100: Revés.'],

 ['CAÇADA','Distância 0–4; sucesso +1, Forte +2, falha −1, Revés −2.'],
 ['TENSÃO','Escala 0–6, com pressão em 3, limite em 5 e Ruptura em 6.'],
 ['DESENVOLVIMENTO','1–2 Marcas por Sessão; custos 4/5/6/8 para melhorias.']
 ].map(([title,detail])=>'<div class="rule-section"><h3>'+title+'</h3><p>'+detail+'</p></div>').join('')+'</div>';

 return R.newCharacter({name:'Desconhecido de Dunmoor',age:25,occupation:history.name,

<script>
/* === investigation.js === */
/* SLASHER v2 · Quadro de investigação compartilhado; segredos não são transmitidos. */
(function(){
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const key=id=>'slasher2_investigation_'+id;
const secretKey=id=>'slasher2_secrets_'+id;
const defaults=()=>({version:2,title:'Caso sem título',summary:'',evidence:[],hypotheses:[],questions:[],updatedAt:null});
function load(s){
 if(!s.campaignId)return;
 if(s.mode==='p2p-client'){s.investigation=s.investigation||defaults();return;}
 try{s.investigation={...defaults(),...(JSON.parse(localStorage.getItem(key(s.campaignId)))||{})}}catch{s.investigation=defaults()}
}
function save(s){if(s.mode==='p2p-client')throw Error('Somente o mestre controla o quadro de investigação');s.investigation.updatedAt=new Date().toISOString();localStorage.setItem(key(s.campaignId),JSON.stringify(s.investigation))}
function secrets(s){
 if(s.mode==='p2p-client')return '';
 try{return localStorage.getItem(secretKey(s.campaignId))||''}catch{return ''}
}
function render(s,gm){
 const d=s.investigation||defaults();
 const section=(label,items,kind)=>'<div class="panel"><div class="panel-title"><h3>'+label+'</h3><span class="tag">'+items.length+'</span></div>'+
 '<div class="v2-evidence-list">'+(items.map(item=>'<article class="v2-evidence"><div><small>'+esc(item.location||item.category||'Registro da equipe')+'</small><h4>'+esc(item.title)+'</h4><p>'+esc(item.description||'')+'</p></div>'+
 (gm?'<button type="button" class="btn small flat" data-action="investigation-remove" data-kind="'+kind+'" data-id="'+esc(item.id)+'">Remover</button>':'')+'</article>').join('')||'<p class="hint">Nenhum registro ainda.</p>')+'</div></div>';
 return '<header class="section-head"><div><div class="eyebrow">DUNMOOR / CASO ABERTO</div><h2>'+esc(d.title)+'</h2><p>'+esc(d.summary||'O que se sabe, o que se suspeita e onde procurar.')+'</p></div></header>'+
 '<div class="grid2">'+section('Pistas confirmadas',d.evidence,'evidence')+section('Hipóteses',d.hypotheses,'hypotheses')+section('Perguntas em aberto',d.questions,'questions')+
 (gm?'<div class="panel"><h3>Registrar descoberta</h3><form data-investigation-form="add" class="stack"><label class="field">Tipo<select name="kind"><option value="evidence">Pista confirmada</option><option value="hypotheses">Hipótese do grupo</option><option value="questions">Pergunta em aberto</option></select></label><label class="field">Título<input name="title" maxlength="140" required></label><label class="field">Local ou fonte<input name="location" maxlength="120"></label><label class="field">Descrição<textarea name="description" maxlength="2000" rows="3"></textarea></label><button type="submit" class="btn red">Adicionar ao arquivo</button></form></div>':'')+'</div>'+
 (gm?'<div class="panel"><h3>Configurar o Caso</h3><form data-investigation-form="settings" class="stack"><label class="field">Nome do Caso<input name="title" maxlength="140" value="'+esc(d.title)+'"></label><label class="field">Resumo público<textarea name="summary" rows="2" maxlength="1500">'+esc(d.summary)+'</textarea></label><button class="btn flat" type="submit">Salvar dados públicos</button></form></div>'+
 '<div class="panel"><h3>Arquivo sigiloso do narrador</h3><p class="hint">Salvo apenas no navegador do mestre. Não entra no estado P2P compartilhado.</p><textarea id="v2-secret-note" rows="7" maxlength="20000">'+esc(secrets(s))+'</textarea><button class="btn small red" data-action="investigation-save-secret">Salvar segredo local</button></div>':'');
}
async function submit(form,ctx){
 const {state:s,refreshCampaign,toast}=ctx;if(!ctx.isGM())throw Error('Somente o narrador pode alterar o quadro');
 const dat=Object.fromEntries(new FormData(form));const d=s.investigation||defaults();
 if(form.dataset.investigationForm==='settings'){d.title=String(dat.title||'Caso sem título').trim().slice(0,140);d.summary=String(dat.summary||'').slice(0,1500)}
 else if(form.dataset.investigationForm==='add'){
 const kind=dat.kind;if(!['evidence','hypotheses','questions'].includes(kind))throw Error('Tipo inválido');
 const title=String(dat.title||'').trim();if(!title)throw Error('Título obrigatório');
 d[kind].push({id:crypto.randomUUID(),title:title.slice(0,140),location:String(dat.location||'').slice(0,120),description:String(dat.description||'').slice(0,2000)});
 }else return;
 s.investigation=d;save(s);await refreshCampaign(true);toast('Arquivo de investigação atualizado.');
}
async function action(act,btn,ctx){
 const {state:s,refreshCampaign,toast}=ctx;if(!ctx.isGM())throw Error('Somente o narrador altera o Caso');
 if(act==='investigation-save-secret'){localStorage.setItem(secretKey(s.campaignId),String(document.getElementById('v2-secret-note')?.value||'').slice(0,20000));toast('Notas secretas salvas no navegador do narrador.');return}
 if(act==='investigation-remove'){
 const k=btn.dataset.kind;if(!['evidence','hypotheses','questions'].includes(k))throw Error('Tipo inválido');
 s.investigation[k]=s.investigation[k].filter(i=>i.id!==btn.dataset.id);save(s);await refreshCampaign(true);
 }
}
window.SLASHER_INVESTIGATION={load,render,submit,action};
})();
</script>
<script>
/* === mesa-v2.js === */

(function(){

const KEY='slasher2_table_';

const gm=s=>s.members?.some(m=>m.user_id===s.user?.id&&m.role==='gm')&&!s.gmPreview;
const pct=(v,max)=>Math.max(0,Math.min(100,Math.round(100*(v||0)/max)));
const testName=r=>r?('D100 '+r.natural+' / '+r.limit+' · '+(r.success?r.grade:'falha')+(r.special?' ('+r.special+')':'')):'';
function load(s){
 if(!s.campaignId)return;
 if(s.mode==='p2p-client'){s.mesa71={...defaults(),...(s.mesa71||{})};return}
 let value;try{value=JSON.parse(localStorage.getItem(KEY+s.campaignId))}catch{}
 s.mesa71={...defaults(),...(value?.version===2?value:{})};
}

function character(s){const chars=s.characters.filter(c=>!R.isLegacy(c)&&(gm(s)||c.owner_id===s.user?.id));return chars.find(c=>c.id===s.selected)||chars[0]}
function threatVisible(s,t){return gm(s)||s.mesa71?.encounter?.active}
function tag(label,n,max){return '<div class="v2-meter"><div class="between"><small>'+esc(label)+'</small><b>'+n+' / '+max+'</b></div><div class="meter"><span style="width:'+pct(n,max)+'%"></span></div></div>'}
function render(s){

 const options=(list)=>list.map(i=>'<option value="'+esc(i.id)+'">'+esc(i.name)+'</option>').join('');
 const threats=(d.threats||[]).filter(t=>threatVisible(s,t));
 const available=threats.filter(t=>t.type==='humano'&&t.vitality>0);
 const fighter=master?s.characters.filter(ch=>ch.schemaVersion===2):s.characters.filter(ch=>ch.schemaVersion===2&&ch.owner_id===s.user?.id);
 const weapons=c?.inventory?.filter(i=>Number(i.damageBase)>0)||[];

function register(s,title,detail){s.mesa71.events.unshift({id:id(),at:new Date().toISOString(),title,detail});s.mesa71.events=s.mesa71.events.slice(0,80)}
function remote(s,op,p,actorId){
 const d=s.mesa71,master=s.members.some(m=>m.user_id===actorId&&m.role==='gm');
 const own=cid=>{const c=s.characters.find(x=>x.id===cid&&x.schemaVersion===2);if(!c||(!master&&c.owner_id!==actorId))throw Error('Ficha sem autorização');return c};
 if(!['v2-attack','v2-chase'].includes(op)&&!master)throw Error('Operação exclusiva do narrador');
 let outcome=null;
 if(op==='v2-attack'){
  if(!d.encounter?.active)throw Error('Não há confronto ativo');
  const c=own(p.actor),t=d.threats.find(x=>x.id===p.target&&x.type==='humano'&&x.vitality>0);
  if(!t)throw Error('Alvo indisponível (anomalias não usam Vitalidade)');
  const att=p.attribute;
  if(!['FOR','AGI','PER'].includes(att))throw Error('Atributo de ataque inválido');
  const skill=att==='PER'?'Armas de Fogo':'Luta';
  const i=Number(p.itemIndex),item=i>=0?c.inventory?.[i]:null;
  if(i>=0&&(!item||Number(item.damageBase)<1||Number(item.damageBase)>4))throw Error('Arma não consta no inventário');
  if(att==='PER'&&(!item||Number(item.damageBase)<3))throw Error('Armas de Fogo exigem uma arma adequada no inventário');
  const attack=R.rollForCharacter(c,{attribute:att,skill,circumstance:Number(p.circumstance||0),difficulty:'normal'});
  let dodge=null,hit=attack.success;
  if(t.dodge>0&&t.stamina>0&&t.reactedRound!==d.encounter.round){
   dodge=R.calculateTest({attribute:t.dodge,training:0,circumstance:0,difficulty:'normal',natural:R.die100()});
   t.stamina-=1;t.reactedRound=d.encounter.round;
   const levels={falha:0,normal:1,forte:2,extraordinario:3};
   if(dodge.success&&levels[dodge.grade]>=levels[attack.grade])hit=false;
  }
  const damage=hit?R.fixedDamage(item?.damageBase||1,attack.grade,attack.special):0;
  if(hit){t.vitality=Math.max(0,t.vitality-damage);if(damage>=3)t.wounds=(t.wounds||0)+1}
  register(s,c.name+' atacou '+t.name,testName(attack)+(dodge?' · Esquiva '+testName(dodge):'')+' · '+(hit?'Dano '+damage:'sem acerto'));
  outcome={attack,dodge,hit,damage};
 }
 else if(op==='v2-chase'){
  if(!d.chase.active)throw Error('Não há caçada ativa');
  const c=own(p.actor),man=p.maneuver;
  if(!['sprint','move','hide','barricade'].includes(man))throw Error('Manobra inválida');
  if(!['Atletismo','Furtividade','Reflexos'].includes(p.skill))throw Error('Competência inválida');
  if(man==='sprint'&&c.stamina>0)c.stamina--;
  let diff=c.stamina===0?'dificil':'normal';
  if(R.inventorySpaces(c.inventory)>6)diff='dificil';
  if(man==='hide'&&d.chase.distance<2)throw Error('É preciso Distância 2 para esconder-se');
  const roll=R.rollForCharacter(c,{attribute:'AGI',skill:p.skill,circumstance:Number(p.circumstance||0),difficulty:diff});
  d.chase=R.chaseStep(d.chase,roll,{sprint:man==='sprint',hide:man==='hide',barricade:man==='barricade'});
  register(s,c.name+' fez manobra de fuga',man+' · '+testName(roll)+' · Distância '+d.chase.distance+'/4');
  outcome={roll,chase:d.chase};
 }
 else if(op==='v2-threat'){
  const t={id:id(),name:String(p.name||'').trim().slice(0,100),type:p.type==='anomalia'?'anomalia':'humano',sign:String(p.sign||'').slice(0,300),pattern:String(p.pattern||'').slice(0,700),limitation:String(p.limitation||'').slice(0,700),
  vitality:p.type==='anomalia'?null:6,vitalityMax:p.type==='anomalia'?null:6,stamina:5,damageBase:R.clamp(p.damageBase,1,4),dodge:R.clamp(p.dodge,0,90),wounds:0};
  if(!t.name)throw Error('Informe o nome da ameaça');d.threats.push(t);outcome=t;
 }
 else if(op==='v2-remove-threat')d.threats=d.threats.filter(t=>t.id!==p.id);
 else if(op==='v2-toggle'){d.encounter.active=!d.encounter.active;if(d.encounter.active)d.encounter.round=1}
 else if(op==='v2-next')d.encounter.round++;
 else if(op==='v2-clock')d.clocks.push({id:id(),name:String(p.name||'').slice(0,80),max:[4,6].includes(Number(p.max))?Number(p.max):4,value:0});
 else if(op==='v2-clock-step'){const k=d.clocks.find(k=>k.id===p.id);if(k)k.value=R.clamp(k.value+Number(p.delta),0,k.max)}
 else if(op==='v2-start-chase'){d.chase={active:true,round:0,distance:R.clamp(p.distance,0,4),speed:['lento','equivalente','rapido'].includes(p.speed)?p.speed:'equivalente',exit:String(p.exit||'').slice(0,200),status:'ativa'};}
 else if(op==='v2-stop-chase')d.chase.active=false;
 else if(op==='v2-threat-attack'){
  if(!d.encounter?.active)throw Error('Inicie um confronto antes de atacar');
  const t=d.threats.find(x=>x.id===p.threat&&x.type==='humano'&&x.vitality>0),v=own(p.victim);
  if(!t)throw Error('Agressor indisponível');
  const attack=R.calculateTest({attribute:50,training:0,circumstance:0,difficulty:'normal',natural:R.die100()});
  let dodge=null,hit=attack.success;
  if(p.dodge==='yes'&&v.stamina>0&&v.reactedRound!==d.encounter.round){
   dodge=R.rollForCharacter(v,{attribute:'AGI',skill:'Reflexos',difficulty:'normal',circumstance:0});
   v.stamina--;v.reactedRound=d.encounter.round;
   const ranks={falha:0,normal:1,forte:2,extraordinario:3};
   if(dodge.success&&ranks[dodge.grade]>=ranks[attack.grade])hit=false;
  }
  const damage=hit?R.fixedDamage(t.damageBase,attack.grade,attack.special):0;
  if(hit)Object.assign(v,R.applyDamage(v,damage,'a definir'));
  register(s,t.name+' atacou '+v.name,testName(attack)+(dodge?' · Esquiva '+testName(dodge):'')+' · Dano '+damage);
  outcome={attack,dodge,hit,damage};
 }
 else if(op==='v2-grant'){
  const c=own(p.character),item={name:String(p.name||'').trim().slice(0,100),slots:Number(p.slots),damageBase:R.clamp(p.damageBase,0,4)};
  if(!item.name||![1,2,3].includes(item.slots))throw Error('Item inválido');
  if(R.inventorySpaces(c.inventory)+item.slots>12)throw Error('Carga acima do limite de transporte improvisado (12 Espaços)');
  c.inventory.push(item);outcome=item;
 }
 else throw Error('Operação desconhecida');
 persist(s);return outcome;
}
async function apply(op,p,ctx){
 const {state:s,api,refreshCampaign,toast}=ctx;
 let result;
 if(s.mode==='p2p-client')result=await api.remoteMesa(op,p);
 else {result=remote(s,op,p,s.user.id);api.save?.();}
 await refreshCampaign(true);
 if(result?.attack||result?.roll)toast(result.attack?'Ataque: '+testName(result.attack):'Fuga: '+testName(result.roll));
 else toast('Mesa atualizada.');
 return result;
}
async function action(act,btn,ctx){
 const d=btn.dataset;
 const ops={'mesa-v2-toggle':['v2-toggle',{}],'mesa-v2-next':['v2-next',{}],'mesa-v2-stop-chase':['v2-stop-chase',{}],'mesa-v2-remove-threat':['v2-remove-threat',{id:d.id}],'mesa-v2-clock':['v2-clock-step',{id:d.id,delta:Number(d.delta)}]};
 if(!ops[act])return;
 if(!gm(ctx.state))throw Error('Só o mestre pode alterar este controle');
 await apply(...ops[act],ctx);
}
async function submit(form,ctx){
 const dat=Object.fromEntries(new FormData(form)),kind=form.dataset.mesaForm;
 if(!kind)return;
 if(kind==='v2-attack')return apply('v2-attack',{actor:dat.actor,target:dat.target,attribute:dat.attribute,itemIndex:Number(dat.itemIndex),circumstance:Number(dat.circumstance)},ctx);
 if(kind==='v2-chase')return apply('v2-chase',{actor:dat.actor,maneuver:dat.maneuver,skill:dat.skill,circumstance:Number(dat.circumstance)},ctx);
 if(!gm(ctx.state))throw Error('Somente o mestre altera a cena');
 const ops={'v2-threat':['v2-threat',{...dat,damageBase:Number(dat.damageBase),dodge:Number(dat.dodge)}],
  'v2-clock':['v2-clock',{name:dat.name,max:Number(dat.max)}],
  'v2-start-chase':['v2-start-chase',{distance:Number(dat.distance),speed:dat.speed,exit:dat.exit}],
  'v2-threat-attack':['v2-threat-attack',dat],
  'v2-grant':['v2-grant',{...dat,slots:Number(dat.slots),damageBase:Number(dat.damageBase)}]};
 if(!ops[kind])throw Error('Formulário desconhecido');
 return apply(...ops[kind],ctx);
}
function focusChanged(s,selected){s.selected=selected;s._mesaRender?.()}
window.SLASHER71={load,render,action,submit,focusChanged,attachDrag:()=>{},roleGM:gm,remote};
})();

class LocalAPI{
 constructor(){this.me={id:'demo-gm',email:'',user_metadata:{display_name:'Mestre'}};this.data=null} // ID legado preserva permissões.
 seed(){return {campaigns:[],members:[],characters:[],effects:[],rolls:[],audit:[],notes:{}}}
 isLegacySample(c){return c?.id==='dunmoore-1999'&&c?.invite_code==='DEMO-777'&&c?.name==='Dunmoore: Ecos da Montanha'}
 save(){try{localStorage.setItem(NOCACHE,JSON.stringify(this.data))}catch{ /* armazenamento restrito: sessão em memória */ }}
 async init(){try{this.data=JSON.parse(localStorage.getItem(NOCACHE))||this.seed()}catch{this.data=this.seed()}this.save();return this.me}
 async logout(){return true}
 async listCampaigns(){return this.data.members.filter(m=>m.user_id===this.me.id).map(m=>({...m,campaign:this.data.campaigns.find(c=>c.id===m.campaign_id)})).filter(m=>m.campaign&&!this.isLegacySample(m.campaign))}
 async createCampaign(n,nick){const id=uuid(),c={id,name:n,invite_code:uuid().replace(/-/g,'').slice(0,12).toUpperCase(),suspicion:0,danger:0,created_at:dateNow()};this.data.campaigns.push(c);this.data.members.push({campaign_id:id,user_id:this.me.id,role:'gm',nickname:nick});this.data.notes[id]='';this.save();return id}
 async joinCampaign(code,nick){const c=this.data.campaigns.find(c=>c.invite_code===code.trim().toUpperCase());if(!c)throw Error('Convite não encontrado neste arquivo. Para jogar com amigos, use o código da Sala P2P.');this.data.members.push({campaign_id:c.id,user_id:this.me.id,role:'player',nickname:nick});this.save();return c.id}
 async loadCampaign(id){return {campaign:this.data.campaigns.find(c=>c.id===id),members:this.data.members.filter(m=>m.campaign_id===id),characters:this.data.characters.filter(c=>c.campaign_id===id),effects:this.data.effects.filter(e=>e.campaign_id===id),rolls:this.data.rolls.filter(r=>r.campaign_id===id).slice(-80).reverse(),audit:this.data.audit.filter(a=>a.campaign_id===id).slice(-35).reverse(),gmNote:this.data.notes[id]||''}}
 async createCharacter(p){const id=uuid(),c=window.SLASHER_RULES.newCharacter({...p,id,campaign_id:p.campaign_id,owner_id:p.npc?null:(p.owner_id||this.me.id)});c.updated_at=dateNow();this.data.characters.push(c);this.audit('Sobrevivente 2.0 criado',id);this.save();return id}
 audit(message,ch){this.data.audit.push({id:uuid(),campaign_id:state.campaignId,actor_id:this.me.id,character_id:ch,message,created_at:dateNow()})}
 async changeStat(id,key,d){const c=this.data.characters.find(c=>c.id===id);if(!c||c.schemaVersion!==2)throw Error('Ficha 2.0 não encontrada');const limits={vitality:6,stamina:5,tension:6,preparations:2,deathRisk:3,development:999};if(!Object.hasOwn(limits,key)||!Number.isInteger(Number(d)))throw Error('Indicador inválido');c[key]=window.SLASHER_RULES.clamp(Number(c[key]||0)+Number(d),0,limits[key]);this.audit('Alterou '+key+' em '+d,id);this.save()}
 async grantEffect(id,kind,title,details){this.data.effects.push({id:uuid(),campaign_id:state.campaignId,character_id:id,kind,title,details,created_at:dateNow()});this.audit(`Concedeu ${kind}: ${title}`,id);this.save()}
 async removeEffect(id){const e=this.data.effects.find(e=>e.id===id);if(!e)return;this.data.effects=this.data.effects.filter(e=>e.id!==id);this.audit(`Removeu ${e.kind}: ${e.title}`,e.character_id);this.save()}
 async setClock(k,v){this.data.campaigns.find(c=>c.id===state.campaignId)[k]=v;this.save()}
 async saveNote(t){this.data.notes[state.campaignId]=t;this.save()}
 async updateCharacter(ch){const c=this.data.characters.find(c=>c.id===ch.id);if(!c||c.schemaVersion!==2)throw Error('Ficha 2.0 não encontrada');const merged={...c,...ch,id:c.id,campaign_id:c.campaign_id,owner_id:c.owner_id,vitality:c.vitality,vitalityMax:c.vitalityMax,stamina:c.stamina,staminaMax:c.staminaMax,tension:c.tension,preparations:c.preparations,wounds:c.wounds,deathRisk:c.deathRisk,marks:c.marks,development:c.development};const errors=window.SLASHER_RULES.validateCharacter(merged,{allowOverload:true});if(errors.length)throw Error(errors.join('; '));Object.assign(c,merged,{updated_at:dateNow()});this.audit('Ficha atualizada',c.id);this.save()}
 async assignCharacter(chId,owner){this.data.characters.find(c=>c.id===chId).owner_id=owner;this.audit('Atribuição de ficha alterada',chId);this.save()}
 async roll(p){const c=this.data.characters.find(c=>c.id===p.character_id&&c.campaign_id===p.campaign_id);if(!c)throw Error('Selecione uma ficha da edição 2.0');const result=window.SLASHER_RULES.rollForCharacter(c,p);const r={...result,schemaVersion:2,id:uuid(),campaign_id:p.campaign_id,actor_id:p.actor_id||this.me.id,character_id:c.id,kind:'test',description:safeInput(p.description,160),created_at:dateNow()};this.data.rolls.push(r);this.save();return r}
}

function p2pPublicSnapshot(){

 return {campaign:dat.campaigns.find(c=>c.id===camp),members:dat.members.filter(m=>m.campaign_id===camp),characters:dat.characters.filter(c=>c.campaign_id===camp),effects:dat.effects.filter(e=>e.campaign_id===camp),rolls:dat.rolls.filter(r=>r.campaign_id===camp).slice(-80).reverse(),audit:dat.audit.filter(e=>e.campaign_id===camp).slice(-35).reverse(),mesa71:mesa,investigation:state.investigation||null};

function downloadP2PBackup(){
 if(state.mode!=='p2p-host')throw Error('Só o mestre pode salvar o arquivo da campanha');
 const table={};
 try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&/^(slasher71_local_|slasher2_table_|slasher2_investigation_)/.test(key))table[key]=JSON.parse(localStorage.getItem(key));else if(key?.startsWith('slasher2_secrets_'))table[key]=localStorage.getItem(key)}}catch{}
 if(state.campaignId&&state.mesa71)table['slasher2_table_'+state.campaignId]=state.mesa71;
 const saved={type:'slasher-p2p-backup',format:1,exportedAt:dateNow(),data:api.data,mesa:table};
 const blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='SLASHER_P2P_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Backup do SLASHER exportado. Guarde esse arquivo em segurança.');
}
async function restoreP2PBackup(file){
 if(state.mode!=='p2p-host')throw Error('Somente o mestre importa backups');
 if(P2P.peers().length)throw Error('Desconecte os jogadores antes de restaurar um backup');
 if(!file||file.size>6*1024*1024)throw Error('O backup precisa ter menos de 6 MB');
 const backup=JSON.parse(await file.text());const db=backup?.data;
 if(backup.type!=='slasher-p2p-backup'||backup.format!==1||!db||!Array.isArray(db.campaigns)||!Array.isArray(db.members)||!Array.isArray(db.characters)||!Array.isArray(db.effects)||!Array.isArray(db.rolls)||!Array.isArray(db.audit)||typeof db.notes!=='object'||!db.notes||typeof backup.mesa!=='object'||!backup.mesa)throw Error('Backup incompatível ou corrompido');
 if(db.campaigns.length>100||db.characters.length>500||Object.keys(backup.mesa).length>100)throw Error('Backup acima do limite permitido');
 if(!confirm('Substituir os arquivos locais do mestre pelos dados deste backup? Esta ação não pode ser desfeita.'))return;
 api.data=db;api.save();
 for(const [key,value] of Object.entries(backup.mesa))if(/^(slasher71_local_|slasher2_table_|slasher2_investigation_|slasher2_secrets_)/.test(key)&&key.length<130)try{localStorage.setItem(key,key.startsWith('slasher2_secrets_')?String(value):JSON.stringify(value))}catch{}
 state.mesa71=null;await loadLobby();toast('Backup restaurado. Abra a campanha para voltar ao jogo.');
}

async function handleGuestRequest(who,method,args){
 if(state.mode!=='p2p-host'||!state.campaignId||!state.campaign)throw Error('O mestre não abriu a campanha');
 if(!api.data.members.some(m=>m.campaign_id===state.campaignId&&m.user_id===who.id))throw Error('Participante não reconhecido');
 const [a,b,c,d]=Array.isArray(args)?args:[];
 const owned=id=>{const ch=api.data.characters.find(x=>x.id===id&&x.campaign_id===state.campaignId);if(!ch||ch.owner_id!==who.id)throw Error('Esta ficha não pertence a você');return ch};
 let result;
 if(method==='createCharacter'){
   const p=a||{};if(!safeInput(p.name,90))throw Error('Nome obrigatório');
   if((p.inventory||[]).some(i=>Number(i.damageBase||0)>2))throw Error('Equipamento de dano 3 ou 4 exige concessão do narrador');
   result=await api.createCharacter({...p,campaign_id:state.campaignId,owner_id:who.id,npc:false});
  }else if(method==='updateCharacter'){
   const current=owned(a?.id);
   for(const k of ['attrs','skills','history','inventory','vitality','stamina','tension','wounds','deathRisk','development','preparations'])
    if(JSON.stringify(a?.[k])!==JSON.stringify(current[k]))throw Error('Edição mecânica requer autorização do narrador');
   result=await api.updateCharacter({...a,portrait:String(a.portrait||'').slice(0,170000),notes:String(a.notes||'').slice(0,5000)});
  }else if(method==='roll'){
   const p=a||{};owned(p.character_id);
   if(p.kind!=='test'||!['normal','dificil','extremo'].includes(p.difficulty||'normal'))throw Error('Tipo de rolagem inválido');
   result=await api.roll({...p,kind:'test',campaign_id:state.campaignId,actor_id:who.id});
 }else if(method==='mesa'){
  const op=a,params=b||{};
  if(!['v2-attack','v2-chase'].includes(op))throw Error('Ação não autorizada');
  owned(params.actor);
  result=window.SLASHER71.remote(state,op,params,who.id);api.save();
 }else throw Error('Ação não autorizada ao jogador P2P');
 await refreshCampaign(false);broadcastP2P();return result;
}
function guestMethods(){
 api.save=()=>{};
 api.listCampaigns=async()=>api.data.members.filter(m=>m.user_id===api.me.id).map(m=>({...m,campaign:api.data.campaigns.find(c=>c.id===m.campaign_id)}));
 api.createCampaign=()=>Promise.reject(Error('Só o mestre pode criar campanhas'));
 api.joinCampaign=()=>Promise.reject(Error('Use o convite WebRTC para entrar'));
 for(const fn of ['createCharacter','updateCharacter','roll'])api[fn]=(...args)=>P2P.call(fn,args);
 for(const fn of ['changeStat','grantEffect','removeEffect','setClock','saveNote','assignCharacter'])api[fn]=()=>Promise.reject(Error('Ação exclusiva do mestre'));
 api.remoteMesa=(op,args)=>P2P.call('mesa',[op,args]);
}

P2P.on('welcome',message=>{

P2P.on('snapshot',async payload=>{

 api.data={campaigns:[payload.campaign],members:payload.members,characters:payload.characters,effects:payload.effects,rolls:payload.rolls,audit:payload.audit,notes:{}};
 state.mesa71=payload.mesa71;state.investigation=payload.investigation;
 if(!state.campaignId){state.campaignId=payload.campaign.id;state.page='mesa';}

P2P.on('disconnected',who=>{
 if(who.role==='client'&&state.mode==='p2p-client'){state.connection='offline';toast('Conexão P2P encerrada. O mestre precisa estar online.');updateConnectionStatus()}

 const editing=!force&&(state.modal||document.activeElement?.closest('form')||document.activeElement?.id==='gm-note'||state.page==='settings');if(!editing)render();else updateConnectionStatus();if(state.mode==='p2p-host')broadcastP2P();}finally{refreshing=false}}

function openDiceOverlay(r){$('#dice-overlay')?.remove();document.body.insertAdjacentHTML('beforeend',renderDiceOverlay(r))}
function executeRoll(p){
 if($('#dice-overlay'))return;
 const local=window.SLASHER_DICE.build(p);
 const optimistic={...p,...local,description:p.description,created_at:new Date().toISOString(),id:'local-'+Date.now()};
 document.body.insertAdjacentHTML('beforeend',renderDiceOverlay(null,true));
 const face=$('#dice-face');let n=1;
 const spin=setInterval(()=>{if(face?.isConnected)face.textContent=String(n++%20+1)},50);
 let statusText='⟳ Sincronizando com a mesa...',failed=false;
 const status=()=>{const el=$('#dice-sync-note');if(el){el.textContent=statusText;el.classList.toggle('error',failed)}};
 const sync=api.roll({...p,clientDice:local}).then(saved=>{
   statusText='✓ Resultado registrado na mesa';
   if(state.campaignId===p.campaign_id){state.rolls=[saved,...state.rolls.filter(r=>r.id!==saved.id)].slice(0,80)}
   status();return saved;
 }).catch(e=>{
   failed=true;statusText='⚠ Não sincronizado. A rolagem não entrou no histórico.';
   status();console.error('Falha ao sincronizar D20:',e);toast('Rolagem não registrada: '+safeErr(e));return null;
 });
 setTimeout(()=>{
  clearInterval(spin);
  if(!$('#dice-overlay'))return;
  if(state.mode==='p2p-client') {sync.then(result=>{if(result&&$('#dice-overlay'))openDiceOverlay(result)});return;}
  openDiceOverlay(optimistic);
  const dialog=$('#dice-overlay .dice-dialog');if(dialog)dialog.insertAdjacentHTML('beforeend','<p class="dice-sync-note" id="dice-sync-note"></p>');
  status();
 },480);
 return sync;
}
function photoCompress(file){return new Promise((resolve,reject)=>{if(!file) return resolve(null);if(!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(Error('Somente JPG, PNG ou WebP.'));if(file.size>8*1024*1024)return reject(Error('Imagem maior que 8 MB.'));const url=URL.createObjectURL(file);const img=new Image();img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Não foi possível abrir a imagem.'))};img.onload=()=>{URL.revokeObjectURL(url);try{const ratio=Math.min(1,320/img.width,390/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#151519';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.72);if(data.length>149000)data=canvas.toDataURL('image/jpeg',.48);if(data.length>149000)throw Error('Imagem ainda é grande demais.');resolve(data)}catch(e){reject(e)}};img.src=url})}

document.addEventListener('click',async e=>{
 if(e.target.id==='modal-backdrop'){state.modal=null;render();return}

 switch(act){
 case 'p2p-host':state.mode='p2p-host';state.user=api.me;await loadLobby();return;
 case 'p2p-join':state.page='p2p-join';render();return;
 case 'p2p-back':p2pAnswer='';p2pWait='';state.page='lobby';render();return;

 case 'p2p-offer':if(state.mode!=='p2p-host'||!state.campaignId)throw Error('Abra uma campanha primeiro');p2pOffer=await P2P.hostOffer();render();return;

 case 'p2p-copy':{const field=document.getElementById(btn.dataset.target);if(field)await copyText(field.value);return}
 case 'p2p-export':downloadP2PBackup();return;
 case 'auth-tab':state.authTab=val;render();return;
 case 'logout':if(state.mode==='p2p-host'||state.mode==='p2p-client'){if(state.mode==='p2p-host'&&P2P.peers().length&&!confirm('Encerrar as conexões dos jogadores?'))return;P2P.close();location.reload();return;}if(state.mode==='online'&&state.user?.is_anonymous&&!confirm('Esta conta está vinculada ao navegador. Sair pode fazer você perder acesso às fichas. Continuar?'))return;await api.logout();state.user=null;state.campaign=null;state.campaignId=null;state.page='lobby';api.unsubscribe?.();render();return;
 case 'go':if(val==='p2p-room'&&!state.campaignId)throw Error('Abra uma campanha antes de criar um convite');if(val==='gm'&&!isGM())throw Error('Apenas o mestre pode usar este painel');state.page=val;state.modal=null;render();return;

 case 'modal':if(val==='grant'&&!isGM())throw Error('Somente o mestre pode conceder itens');if(val==='edit-character'&&!canEdit(state.characters.find(c=>c.id===id)))throw Error('Ficha protegida');state.modal={type:val,id,kind:btn.dataset.kind,portraitData:null};render();return;
 case 'close-modal':state.modal=null;render();return;

 case 'random-fields':{const form=$('#create-character');if(!form)return;const a=randomChar();form.elements.name.value=a.name;form.elements.age.value=a.age;form.elements.class_key.value=a.class_key;form.elements.occupation.value=a.occupation;$('#class-preview').innerHTML=classSummary(a.class_key);return}
 case 'copy-invite':await copyText(state.campaign.invite_code);return;
 case 'clear-portrait':{if(!state.modal)return;state.modal.portraitData='';const el=$('#portrait-preview');if(el)el.innerHTML='<div class="avatar">?</div>';const file=$('#portrait-file');if(file)file.value='';return}
 case 'stat':{if(!isGM())throw Error('Somente o mestre pode alterar indicadores');btn.disabled=true;await syncAction(()=>api.changeStat(id,btn.dataset.stat,Number(btn.dataset.delta)));return}
 case 'set-clock':{if(!isGM())throw Error('Somente o mestre controla os relógios');const key=btn.dataset.key;let newValue=Number(val);if(state.campaign[key]===newValue)newValue=Math.max(0,newValue-1);btn.disabled=true;await syncAction(()=>api.setClock(key,newValue),'Relógio da cidade atualizado.');return}

document.addEventListener('change',async e=>{
 if(e.target.id==='p2p-backup-file'){try{await restoreP2PBackup(e.target.files?.[0])}catch(err){toast('Backup: '+safeErr(err))}return}
 if(e.target.id==='sheet-picker'||e.target.id==='gm-picker'){state.selected=e.target.value;render();return}
 if(e.target.id==='class-picker'){$('#class-preview').innerHTML=classSummary(e.target.value);return}
 if(e.target.id==='m71-focus'){window.SLASHER71.focusChanged(state,e.target.value);render();return}
 if(e.target.id==='portrait-file'){
  try{const data=await photoCompress(e.target.files[0]);if(!state.modal||state.modal.type!=='edit-character')return;state.modal.portraitData=data;$('#portrait-preview').innerHTML=`<div class="avatar"><img alt="Prévia do retrato" src="${esc(data)}"></div>`;toast('Retrato preparado. Clique em salvar ficha para sincronizar.')}catch(err){toast(safeErr(err));e.target.value=''}
 }
});

document.addEventListener('submit',async e=>{
 e.preventDefault();const form=e.target;const formId=form.getAttribute('id');if(!formId&&!form.dataset.mesaForm)return;const dat=Object.fromEntries(new FormData(form).entries());const submit=form.querySelector('button[type=submit]');if(submit?.disabled)return;if(submit)submit.disabled=true;
 try{
 if(form.dataset.investigationForm){await window.SLASHER_INVESTIGATION.submit(form,{state,api,refreshCampaign,render,toast,isGM});return}
 if(form.dataset.mesaForm){await window.SLASHER71.submit(form,{state,api,refreshCampaign,render,toast},e.submitter);return}
 if(formId==='p2p-short-join-form'){p2pNickname=safeInput(dat.nick,32);await P2P.joinRoom(dat.room,p2pNickname);p2pWait='Aguardando conexão com o mestre...';render();return;}
 if(formId==='p2p-join-form'){p2pNickname=safeInput(dat.nick,32);p2pWait='Aguardando o mestre aceitar a conexão...';p2pAnswer=await P2P.joinOffer(String(dat.offer||'').trim(),p2pNickname);render();return;}
 if(formId==='quick-auth-form'){
  if(state.mode!=='online')throw Error('Acesso rápido indisponível na demonstração');const result=await api.anonymousAuth(dat.nickname);state.user=result.user;await loadLobby();toast('Acesso criado como '+dat.nickname);return;
 }
 if(formId==='auth-form'){
 const result=await api.auth(state.authTab,dat.email,dat.password);if(result.session){state.user=result.user;await loadLobby()}else{state.authTab='login';render();toast('Cadastro recebido. Confira seu e-mail para confirmar a conta.')}return;
 }
 if(formId==='create-campaign'){const id=await api.createCampaign(dat.name,dat.nick);state.modal=null;await openCampaign(id);toast('Campanha criada. Abra a Sala P2P para convidar jogadores.');return}
 if(formId==='join-campaign'){const id=await api.joinCampaign(dat.code,dat.nick);state.modal=null;await openCampaign(id);toast('Você entrou na campanha.');return}
 if(formId==='create-character'){
  const data=window.SLASHER_V2.parseCharacterForm(dat);
  const id=await api.createCharacter({...data,campaign_id:state.campaignId,npc:false});
  state.selected=id;state.modal=null;state.page='sheet';await refreshCampaign(true);toast('Sobrevivente 2.0 criado.');return;
  }
 if(formId==='grant-effect'){if(!isGM())throw Error('Apenas o mestre pode conceder recursos');await api.grantEffect(dat.character_id,dat.kind,dat.title.trim(),dat.details.trim());state.modal=null;await refreshCampaign(true);toast('Recurso concedido e sincronizado.');return}
 if(formId==='assign-character'){if(!isGM())throw Error('Apenas o mestre atribui fichas');await api.assignCharacter(dat.id,dat.owner_id||null);state.modal=null;await refreshCampaign(true);toast('Responsável pela ficha atualizado.');return}
 if(formId==='edit-character'){
  const prev=state.characters.find(c=>c.id===dat.id);if(!canEdit(prev))throw Error('Ficha protegida');
  const next=window.SLASHER_V2.parseCharacterForm(dat,prev);
  next.portrait=state.modal?.portraitData??prev.portrait;
  await api.updateCharacter(next);state.modal=null;await refreshCampaign(true);toast('Ficha 2.0 salva.');return;
  }
 if(formId==='dice-form'){
   const character=state.characters.find(c=>c.id===dat.character_id);
   if(!character||!canEdit(character))throw Error('Você não controla esta ficha');
   const p={campaign_id:state.campaignId,character_id:character.id,kind:'test',attribute:dat.attribute,skill:dat.skill||null,
   difficulty:dat.difficulty,circumstance:Number(dat.circumstance),description:dat.description||'Teste de '+dat.attribute};
   const result=await api.roll(p);
   await refreshCampaign(true);
   toast('D100 '+result.natural+' / '+result.limit+' · '+(result.success?'SUCESSO '+result.grade.toUpperCase():'FALHA')+(result.special?' · '+result.special.toUpperCase():''));
   return;
  }
  }catch(err){console.error(err);toast('Erro: '+safeErr(err))}finally{if(submit?.isConnected)submit.disabled=false}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dice-overlay')){$('#dice-overlay').remove();return}if(state.modal){state.modal=null;render()}}});
window.addEventListener('storage',e=>{if(state.mode==='local'&&e.key===NOCACHE&&state.user){try{api.data=JSON.parse(e.newValue);if(state.campaignId)refreshCampaign(false);else loadLobby()}catch{}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.campaignId&&state.mode==='online')refreshCampaign(false).catch(console.error)});
setInterval(()=>{if(!document.hidden&&state.campaignId&&state.mode==='online')refreshCampaign(false).catch(console.error)},20000);
(async()=>{try{const user=await api.init();state.user=state.mode==='local'?null:user;if(user&&state.mode==='online')await loadLobby();else render()}catch(e){console.error(e);$('#app').innerHTML=`<div class="login-side" style="min-height:100vh"><div class="panel"><h2>Falha de conexão</h2><p>${esc(safeErr(e))}</p><p class="hint">Recarregue a página e verifique o armazenamento local.</p><button class="btn red" onclick="location.reload()">Tentar novamente</button></div></div>`}})();
</script>
